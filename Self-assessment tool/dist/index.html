<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The security story is this line. default-src 'none' plus connect-src 'none' means the page
  cannot fetch, XHR, open a websocket, load an image from a host, or submit a form anywhere.
  Everything it needs is inlined below. It works with the network cable pulled out.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>GC Enterprise Architecture self-assessment</title>
<style>:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #1d2125; --muted: #5c6874; --line: #d8dde3;
  --accent: #1f4e79; --accent-ink: #ffffff;
  --green: #1e7b45; --lime: #6a8f1f; --amber: #b3730c; --red: #a8261f;
  --green-bg: #e6f3ea; --lime-bg: #f0f4e2; --amber-bg: #fbf1e0; --red-bg: #fbe9e7;
  --radius: 6px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
h2 { font-size: 1.15rem; margin: 0 0 .6rem; }
h3 { font-size: 1rem; margin: 1.2rem 0 .5rem; display: flex; align-items: center; gap: .5rem; }
p { margin: 0 0 .7rem; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.warn-text { color: var(--amber); }

.topbar { background: var(--accent); color: var(--accent-ink); padding: .6rem 1.2rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: .6rem; cursor: pointer; }
.brand .ver { font-size: .78rem; opacity: .8; }
.topbar nav { display: flex; gap: .3rem; }
.tab { background: transparent; color: var(--accent-ink); border: 1px solid rgba(255,255,255,.35);
  padding: .35rem .8rem; border-radius: var(--radius); cursor: pointer; font-size: .9rem; }
.tab.on { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }

.body { max-width: 900px; margin: 1.2rem auto 5rem; padding: 0 1rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
.card.warn { border-color: var(--amber); background: var(--amber-bg); }
.sitefoot { text-align: center; color: var(--muted); font-size: .8rem; padding: 1rem 0 2rem; }

button { font: inherit; cursor: pointer; border-radius: var(--radius); padding: .45rem .9rem; }
button.primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
button.ghost, .filelabel { background: #fff; color: var(--accent); border: 1px solid var(--line); }
button.small, .ghost.small { padding: .2rem .55rem; font-size: .84rem; }
.filelabel { display: inline-block; padding: .45rem .9rem; cursor: pointer; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

.field { display: block; margin-bottom: .8rem; }
.field > span { display: block; font-size: .88rem; color: var(--muted); margin-bottom: .2rem; }
input[type=text], input[type=number], textarea, select {
  font: inherit; width: 100%; padding: .4rem .5rem; border: 1px solid var(--line);
  border-radius: var(--radius); background: #fff; color: var(--ink); }
input[type=number] { width: 4.5rem; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 1rem; }

.stage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: .5rem; }
.stage-card { display: flex; gap: .5rem; align-items: flex-start; border: 1px solid var(--line);
  border-radius: var(--radius); padding: .6rem; cursor: pointer; background: #fff; }
.stage-card:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dlg-link { display: block; font-size: .8rem; margin-top: .2rem; }

.question { border-top: 1px solid var(--line); padding: .9rem 0 .3rem; }
.q-head { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .25rem; }
.qid { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums;
  border: 1px solid var(--line); border-radius: 3px; padding: 0 .3rem; }
.q-text { font-weight: 600; flex: 1 1 20rem; }
.badge { font-size: .74rem; padding: .05rem .4rem; border-radius: 3px; border: 1px solid; }
.badge-warn { color: var(--amber); border-color: var(--amber); background: var(--amber-bg); }
.badge-soft { color: var(--muted); border-color: var(--line); background: var(--bg); }

.ladder-box { margin: .3rem 0 .5rem; font-size: .88rem; }
.ladder-box summary { cursor: pointer; color: var(--accent); }
.ladder { margin: .4rem 0; padding-left: 1.1rem; }
.ladder li { margin-bottom: .2rem; }

.score-row { display: flex; gap: .25rem; flex-wrap: wrap; align-items: center; margin: .4rem 0 .7rem; }
.score-btn { width: 2.1rem; padding: .3rem 0; text-align: center; background: #fff;
  border: 1px solid var(--line); color: var(--ink); }
.score-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.score-btn:disabled { opacity: .35; cursor: not-allowed; }
.na { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: .3rem; margin-left: .5rem; }
.na input { width: auto; }

.evidence { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .6rem .7rem; margin-bottom: .5rem; }
.ev-head { display: flex; gap: .5rem; flex-wrap: wrap; align-items: baseline; margin-bottom: .2rem; }
.note-secure { border-left: 3px solid var(--accent); padding-left: .5rem; margin: .3rem 0 .6rem; }
.ev-row { display: grid; grid-template-columns: 1.4fr .8fr 1.4fr 1fr auto; gap: .3rem; margin-bottom: .3rem; }
.ev-list { padding-left: 1.1rem; }

.sticky-footer { position: sticky; bottom: 0; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: .5rem .8rem; box-shadow: 0 -2px 10px rgba(0,0,0,.06); }
.footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.footer-score { display: flex; align-items: center; gap: .6rem; }
.footer-actions { display: flex; gap: .5rem; }

.pill { display: inline-block; min-width: 2.4rem; text-align: center; font-weight: 700;
  padding: .1rem .45rem; border-radius: 999px; border: 1px solid; }
.pill.small { min-width: 1.9rem; font-size: .82rem; }
.green, .pill.green { color: var(--green); border-color: var(--green); background: var(--green-bg); }
.lime,  .pill.lime  { color: var(--lime);  border-color: var(--lime);  background: var(--lime-bg); }
.amber, .pill.amber { color: var(--amber); border-color: var(--amber); background: var(--amber-bg); }
.red,   .pill.red   { color: var(--red);   border-color: var(--red);   background: var(--red-bg); }
.none,  .pill.none  { color: var(--muted); border-color: var(--line); background: var(--bg); }
td.green, td.lime, td.amber, td.red, td.none { background: none; font-weight: 700; }

.headline { display: flex; gap: 1.2rem; align-items: flex-start; flex-wrap: wrap; }
.bigscore { flex: 0 0 auto; border: 2px solid; border-radius: var(--radius); padding: .7rem 1.1rem; text-align: center; }
.bigscore .num { display: block; font-size: 2.6rem; font-weight: 800; line-height: 1; }
.bigscore .outof { font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; }
.headline-text { flex: 1 1 20rem; }
.band { border-left: 4px solid; padding: .4rem .7rem; margin: .5rem 0; border-radius: 0 var(--radius) var(--radius) 0; }
.band.good { border-color: var(--green); background: var(--green-bg); }
.band.neutral { border-color: var(--muted); background: var(--bg); }
.band.bad { border-color: var(--red); background: var(--red-bg); }

.bar-row { display: grid; grid-template-columns: 15rem 1fr 3rem; gap: .6rem; align-items: center; margin-bottom: .4rem; }
.bar-label { font-size: .9rem; }
.bar-track { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; height: .9rem; overflow: hidden; }
.bar-fill { height: 100%; }
.bar-fill.green { background: var(--green); } .bar-fill.lime { background: var(--lime); }
.bar-fill.amber { background: var(--amber); } .bar-fill.red { background: var(--red); }
.bar-num { text-align: right; font-weight: 700; }

.backlog-item { border-top: 1px solid var(--line); padding: .7rem 0; }
.steps { margin: .3rem 0; padding-left: 1.2rem; }
.steps li { margin-bottom: .25rem; }

.flag { border-left: 4px solid var(--line); background: var(--bg); padding: .45rem .7rem;
  margin-bottom: .45rem; border-radius: 0 var(--radius) var(--radius) 0; }
.flag.sev-high { border-color: var(--red); background: var(--red-bg); }
.flag.sev-medium { border-color: var(--amber); background: var(--amber-bg); }
.flag.sev-low { border-color: var(--muted); }
.flag.sev-info { border-color: var(--accent); }
.challenge { font-style: italic; margin-top: .2rem; }

table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.domain-row td { background: var(--bg); font-weight: 700; }
.triage tbody tr:hover { background: var(--bg); }

.dropzone.over { border-color: var(--accent); background: var(--green-bg); }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.2rem; }
.audit-row { border-top: 1px solid var(--line); padding: .6rem 0; }
.said { background: var(--bg); border-left: 3px solid var(--line); padding: .3rem .5rem; }
.audit-controls { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: .4rem; }
.audit-controls label { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: .3rem; }
.audit-controls select, .audit-controls input[type=text] { width: auto; flex: 1 1 8rem; }

@media print {
  .topbar, .sticky-footer, .actions, .sitefoot, button, .filelabel { display: none !important; }
  body { background: #fff; }
  .card { border: none; padding: 0 0 .8rem; margin: 0 0 .8rem; page-break-inside: avoid; }
  details { display: block; } details > summary { display: none; }
  .body { max-width: none; margin: 0; }
}

/* ---- domain stepper, for a 176-question rubric ---- */
.stepper { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: 1rem; }
.step { display: flex; flex-direction: column; align-items: flex-start; gap: .1rem;
  background: var(--card); border: 1px solid var(--line); color: var(--ink);
  padding: .4rem .7rem; border-radius: var(--radius); min-width: 6.5rem; }
.step.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.step.complete { background: var(--green-bg); border-color: var(--green); }
.step-label { font-size: .9rem; font-weight: 600; }
.step-count { font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.card.section { padding: .6rem .8rem; }
.section-summary { cursor: pointer; display: flex; align-items: center; gap: .6rem;
  flex-wrap: wrap; padding: .2rem 0; }
.section-title { font-weight: 700; flex: 1 1 14rem; }
.section-head { display: flex; align-items: center; gap: .5rem; margin: 1rem 0 .3rem;
  border-bottom: 1px solid var(--line); padding-bottom: .2rem; font-size: .95rem; }
.section-row td { background: var(--bg); font-weight: 600; font-size: .85rem; color: var(--muted); }
.chosen { margin: -.3rem 0 .5rem; }
.maturity { border-left: 4px solid var(--accent); background: var(--bg); padding: .4rem .7rem;
  margin: .5rem 0; border-radius: 0 var(--radius) var(--radius) 0; }

/* ---- classification marking ---- */
.marking-banner { text-align: center; font-weight: 800; letter-spacing: .12em; font-size: .82rem;
  padding: .25rem; background: var(--ink); color: #fff; }
.marking-banner.unmarked { background: var(--red); }
.marking-row { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .4rem; }
.marking-chip { border: 1px solid var(--line); border-radius: var(--radius); padding: .3rem .7rem;
  background: #fff; cursor: pointer; font-size: .9rem; display: flex; align-items: center; gap: .35rem; }
.marking-chip.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
.marking-chip input { width: auto; }
.marking-inline { display: inline-block; font-size: .82rem; font-weight: 700; letter-spacing: .06em;
  border: 1px solid var(--ink); padding: .05rem .45rem; border-radius: 3px; margin-top: .3rem; }
.marking-inline.unmarked { border-color: var(--red); color: var(--red); }
.gate { background: var(--amber-bg); border-bottom: 1px solid var(--amber); color: var(--amber);
  padding: .3rem .6rem; margin: -.5rem -.8rem .5rem; }
select.needs-marking { border-color: var(--red); background: var(--red-bg); }
button:disabled { opacity: .45; cursor: not-allowed; }

/* ---- evidence with attachments ---- */
.ev-item { border-top: 1px dashed var(--line); padding: .4rem 0; }
.ev-item.unmarked { background: var(--red-bg); }
.ev-row { display: grid; grid-template-columns: 1.6fr .8fr 1.1fr auto; gap: .3rem; }
.ev-row2 { display: grid; grid-template-columns: auto 1fr; gap: .3rem; margin-top: .25rem; align-items: center; }
.att { display: flex; align-items: center; gap: .4rem; background: var(--green-bg);
  border: 1px solid var(--green); border-radius: var(--radius); padding: .15rem .4rem; }
.att-name { font-weight: 600; font-size: .86rem; max-width: 16rem; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }

@media print {
  .marking-banner { display: block !important; background: none; color: #000; border-bottom: 2px solid #000; }
}
</style>

calability, maintainability) are an afterthought."},{value:5,colour:"Yellow",name:"Integrated",label:"This is the Baseline. All desired capabilities are present and connected. The system is stable and performs as expected under normal conditions."},{value:6,colour:"Yellow-Green",name:"Managed",label:"Capabilities are monitored and measured. The architecture can handle predictable growth and has basic fault tolerance."},{value:7,colour:"Green",name:"Scalable & Secure",label:'The architecture is "hardened." It handles bursts in demand effortlessly and has proactive security measures built into the design.'},{value:8,colour:"Dark Green",name:"Agile/Extensible",label:"The architecture is modular. Adding a new desired capability does not require a rewrite; the system is designed to be plugged into and extended."},{value:9,colour:"Blue",name:"Predictive",label:"The architecture uses telemetry and AI/ML to anticipate needs (e.g., auto-scaling before a spike or self-healing before a crash)."},{value:10,colour:"Purple",name:"Symbiotic",label:'The "North Star" state. The architecture and business strategy are one. The system is so flexible it can pivot to entirely new business models with minimal architectural friction.'}]},maturityBands:[{min:9,label:"Leading Practice",detail:"Predictive, self-optimizing, fully aligned with business strategy."},{min:7,label:"Advanced",detail:"Hardened, scalable, and modular. Demonstrably high-quality architecture."},{min:5,label:"Baseline Ready",detail:"Core capabilities present and stable. Meets minimum GC EA expectations."},{min:3,label:"Developing",detail:"Foundational elements exist but architecture is immature and at risk under stress."},{min:0,label:"Critical Risk",detail:"Immediate intervention required. Core capabilities absent or severely compromised."}],maturityBandsNote:"Dan's own reference guide, from the Summary Dashboard sheet.",bands:[{id:"showcase",min:8.5,label:"Showcase",routing:"No board slot needed. TBS may ask to showcase this work.",tone:"good"},{id:"hallpass",min:6,label:"Hall pass",routing:"Suggested: no GC EARB appearance required. Subject to audit sample.",tone:"good"},{id:"routine",min:3,label:"Routine",routing:"Suggested: no board time. Assessor spot-check only.",tone:"neutral"},{id:"attend",min:0,label:"Bring it to the board",routing:"Suggested: attend GC EARB. Come and tell us why, and what the plan is.",tone:"bad"}],bandsNote:"ROUTING, not maturity. These are Dan's spoken numbers from 2026-08-26 (60% hall pass, 8.5 showcase, ~2 come and explain) and are NOT in his workbook or signed off by anyone. Maturity labels above are his.",stageMultipliers:{"low-ok":.25,expected:1,critical:1.5},stageMultipliersNote:'Our addition. Lifecycle stage is not captured in the current process at all - Dan named it as the key missing field. Only "Defining the Current State" sections carry a rule so far.',lifecycleStages:[{id:"discovery",label:"Create - Discovery",dlgPage:"Create phase",blurb:"Understanding the problem. There may be no current solution to describe yet."},{id:"alpha",label:"Create - Alpha",dlgPage:"Create phase",blurb:"Testing whether an approach can work, with real users."},{id:"beta",label:"Create - Beta",dlgPage:"Create phase",blurb:"Building the real thing in public, at growing scale."},{id:"stabilization",label:"Live - Stabilization",dlgPage:"Live phase",blurb:"In service, settling down. Costs and operations should be known."},{id:"growth",label:"Live - Growth",dlgPage:"Live phase",blurb:"In service, scaling up."},{id:"maturity",label:"Live - Maturity",dlgPage:"Live phase",blurb:"In service, steady state. Everything should be documented and measured."},{id:"sunset",label:"Sunset",dlgPage:"Sunset phase",blurb:"Replacing or retiring. Dependencies and data disposition matter most."}],domains:[{id:"business",label:"Business Architecture",weight:25,description:"Connecting strategy to execution through structured design",sections:[{id:"defining-the-current-state",label:"Defining the Current State",weight:5,questions:[{id:"BU-Q1",sheetRef:"Q1",text:"How thoroughly has the current state of this solution been documented, including all processes, data flows, and system dependencies?",weight:1},{id:"BU-Q2",sheetRef:"Q2",text:"What entities (data objects, records, clients, files) are currently produced, managed, or maintained by this solution?",weight:1},{id:"BU-Q3",sheetRef:"Q3",text:"Have all roles and responsibilities across stakeholders, operators, and service consumers been identified, documented, and formally accepted?",weight:1},{id:"BU-Q4",sheetRef:"Q4",text:"How well understood is the criticality of this solution to Government of Canada program delivery and citizen outcomes?",weight:1},{id:"BU-Q5",sheetRef:"Q5",text:"Are all sub-components of the current solution assessed for their individual criticality, availability, and risk exposure?",weight:1},{id:"BU-Q6",sheetRef:"Q6",text:"What is the current level of utilization and demand for the solution (transaction volumes, active users, peak load)?",weight:1},{id:"BU-Q7",sheetRef:"Q7",text:"What is the known availability, uptime, and service continuity record of the current solution?",weight:1},{id:"BU-Q8",sheetRef:"Q8",text:"How well understood are the total lifecycle costs \u2014 including build, operate, maintain, and decommission \u2014 of the current solution?",weight:1},{id:"BU-Q9",sheetRef:"Q9",text:"What are the current unit economics (cost per transaction, cost per entity managed) and how are they tracked?",weight:1},{id:"BU-Q10",sheetRef:"Q10",text:"How mature and current are the performance indicators for this solution, and what trends do they reflect?",weight:1},{id:"BU-Q11",sheetRef:"Q11",text:"Is the lifespan and full lifecycle of the solution mapped out, and is the current position within that lifecycle known?",weight:1},{id:"BU-Q12",sheetRef:"Q12",text:"What major events (technology refresh, contract renewal, legislative changes) are on the horizon for this solution?",weight:1},{id:"BU-Q13",sheetRef:"Q13",text:"How well understood are the specific skills, staffing levels, and capacity requirements to operate and evolve this solution?",weight:1},{id:"BU-Q14",sheetRef:"Q14",text:"How are universal requirements \u2014 accessibility, official languages, inclusion, and privacy \u2014 currently addressed in the solution?",weight:1}],stageExpectation:{discovery:"low-ok",alpha:"low-ok"}},{id:"defining-the-business-solution",label:"Defining the Business Solution",weight:25,questions:[{id:"BU-Q15",sheetRef:"Q15",text:"How clearly and completely has the core business problem been defined and agreed upon by all stakeholders?",weight:1},{id:"BU-Q16",sheetRef:"Q16",text:"Is there a documented business case that articulates the expected value, outcomes, and measurable benefits of the proposed solution?",weight:1},{id:"BU-Q17",sheetRef:"Q17",text:"How well do the proposed solution capabilities map to the GC Business Capability Model and existing enterprise services?",weight:1},{id:"BU-Q18",sheetRef:"Q18",text:"Have value streams been fully mapped, showing how business capabilities deliver outcomes to clients and citizens?",weight:1},{id:"BU-Q19",sheetRef:"Q19",text:"Is the solution design driven by defined user personas, journeys, and evidence-based user research?",weight:1},{id:"BU-Q20",sheetRef:"Q20",text:"How clearly are the target service levels, response times, and quality benchmarks defined for the proposed solution?",weight:1},{id:"BU-Q21",sheetRef:"Q21",text:"Has the solution's criticality to GC program delivery been assessed, and does the architecture reflect that criticality?",weight:1},{id:"BU-Q22",sheetRef:"Q22",text:"Is there a funding model and sourcing strategy that is sustainable across the full lifecycle of the solution?",weight:1},{id:"BU-Q23",sheetRef:"Q23",text:"How well is the talent strategy defined, including required skills, existing capacity, training pipeline, and long-term retention?",weight:1},{id:"BU-Q24",sheetRef:"Q24",text:"Is a demand forecast available, and does the solution design account for projected growth and usage variability?",weight:1},{id:"BU-Q25",sheetRef:"Q25",text:"How well is the solution integrated within the broader GC enterprise ecosystem and aligned with whole-of-government priorities?",weight:1},{id:"BU-Q26",sheetRef:"Q26",text:"Is the solution designed to maximize reuse of existing GC shared services and platforms before building new capabilities?",weight:1},{id:"BU-Q27",sheetRef:"Q27",text:"How transparent is the solution design \u2014 is it documented, accessible, and understandable to those who rely on it?",weight:1}]},{id:"demonstrated-engagement",label:"Demonstrated Engagement",weight:10,questions:[{id:"BU-Q28",sheetRef:"Q28",text:"Have user personas, stories, and journeys been mapped and validated through direct engagement with actual users and stakeholders?",weight:1},{id:"BU-Q29",sheetRef:"Q29",text:"Are there formal, repeatable mechanisms to capture client, user, and stakeholder needs on a continuous basis?",weight:1},{id:"BU-Q30",sheetRef:"Q30",text:"How mature are feedback loops between the delivery team and end users, including Communities of Practice and regular reviews?",weight:1},{id:"BU-Q31",sheetRef:"Q31",text:"Are all roles, accountabilities, and decision rights across the solution ecosystem clearly documented in a RACI or equivalent model?",weight:1},{id:"BU-Q32",sheetRef:"Q32",text:"Is solution documentation, interactive guidance, and self-service assistance available and actively maintained for all user types?",weight:1},{id:"BU-Q33",sheetRef:"Q33",text:"How transparent is the operational status of the solution, including an offering roadmap and historical event schedule?",weight:1},{id:"BU-Q34",sheetRef:"Q34",text:"Are performance metrics (NPS, CSAT, CES, usage rates, drop-off rates) defined, measured, and reported back to stakeholders?",weight:1},{id:"BU-Q35",sheetRef:"Q35",text:"Does the solution support multi-channel delivery patterns (web, chat, phone, in-person) that reflect real user demand?",weight:1},{id:"BU-Q36",sheetRef:"Q36",text:"How mature are personalization, predictive analytics, or AI-assisted capabilities within the solution offering?",weight:1}]},{id:"calculated-measured-and-transparent-performance-and-value",label:"Calculated, Measured & Transparent Performance & Value",weight:10,questions:[{id:"BU-Q37",sheetRef:"Q37",text:"Are Service Level Objectives (SLOs) and Service Level Agreements (SLAs) formally defined, monitored, and reported?",weight:1},{id:"BU-Q38",sheetRef:"Q38",text:"Is there end-to-end instrumentation of delivery processes, enabling real-time performance monitoring and visualization?",weight:1},{id:"BU-Q39",sheetRef:"Q39",text:"How well are costs, prices, and unit economics tracked and published, enabling informed investment decisions?",weight:1},{id:"BU-Q40",sheetRef:"Q40",text:"Are client satisfaction scores (CSAT, NPS, or equivalent) captured systematically and acted upon?",weight:1},{id:"BU-Q41",sheetRef:"Q41",text:"How are quality and error rates measured, tracked, and used to drive continuous improvement?",weight:1},{id:"BU-Q42",sheetRef:"Q42",text:"Are response times, total transaction times, and execution time variance measured and within defined thresholds?",weight:1},{id:"BU-Q43",sheetRef:"Q43",text:"Is trend analysis performed regularly on key metrics to anticipate performance changes and drive proactive action?",weight:1},{id:"BU-Q44",sheetRef:"Q44",text:"Are periodic evaluations of continuing business need performed to assess whether the solution still justifies its cost?",weight:1}]},{id:"operational-readiness",label:"Operational Readiness",weight:10,questions:[{id:"BU-Q45",sheetRef:"Q45",text:"How well-defined is the delivery pipeline, including deployment cadence, automation, rollback procedures, and success rates?",weight:1},{id:"BU-Q46",sheetRef:"Q46",text:"Are skills requirements, staffing levels, and a training and improvement pipeline in place to sustain operations?",weight:1},{id:"BU-Q47",sheetRef:"Q47",text:"Is there an established and confirmed funding strategy, including lifecycle funding beyond the initial build phase?",weight:1},{id:"BU-Q48",sheetRef:"Q48",text:"How mature and tested is the incident management, business continuity, and disaster recovery planning for this solution?",weight:1},{id:"BU-Q49",sheetRef:"Q49",text:"Is the infrastructure and technology acquisition strategy defined, including procurement pathways and lead times?",weight:1},{id:"BU-Q50",sheetRef:"Q50",text:"Has a formal threat and risk assessment (including sovereignty and security classification) been completed and reviewed?",weight:1},{id:"BU-Q51",sheetRef:"Q51",text:"How deep and well-prioritized is the feature and requirements backlog, and does it reflect validated stakeholder needs?",weight:1},{id:"BU-Q52",sheetRef:"Q52",text:"Are there operational runbooks, monitoring dashboards, and on-call processes in place to support production operations?",weight:1}]},{id:"governance-and-strategy",label:"Governance & Strategy",weight:20,questions:[{id:"BU-Q53",sheetRef:"Q53",text:"Is there a clearly defined governance model with accountable decision-makers for the solution's direction and performance?",weight:1},{id:"BU-Q54",sheetRef:"Q54",text:"How well does the solution align with the GC Digital Operations Strategic Plan and departmental enterprise strategy?",weight:1},{id:"BU-Q55",sheetRef:"Q55",text:"Is there a published roadmap with near, medium, and long-term milestones that is communicated to stakeholders?",weight:1},{id:"BU-Q56",sheetRef:"Q56",text:"How mature is the change management process, including impact assessment, approval workflows, and communication plans?",weight:1},{id:"BU-Q57",sheetRef:"Q57",text:"Are compliance requirements (legal, regulatory, policy, accessibility, bilingualism) formally tracked and verified?",weight:1},{id:"BU-Q58",sheetRef:"Q58",text:"Is there a formal risk register maintained for the solution, with assigned owners and documented mitigation strategies?",weight:1},{id:"BU-Q59",sheetRef:"Q59",text:"How well is vendor and third-party relationship governance defined, including performance monitoring and exit strategies?",weight:1},{id:"BU-Q60",sheetRef:"Q60",text:"Is there a documented and approved data governance model aligned with the solution's information and privacy requirements?",weight:1},{id:"BU-Q61",sheetRef:"Q61",text:"How well does the solution contribute to GC-wide shared service consolidation and enterprise architecture objectives?",weight:1}]}]},{id:"data",label:"Data & Information Architecture",weight:25,description:"Turning raw data into trusted, connected insights",sections:[{id:"defining-the-current-state",label:"Defining the Current State",weight:10,questions:[{id:"DA-Q1",sheetRef:"Q1",text:"How well documented are current data models, entity relationships, and data-sharing agreements?",weight:1},{id:"DA-Q2",sheetRef:"Q2",text:"What is the degree of data fragmentation, duplication, and inconsistency across the current solution and its dependencies?",weight:1},{id:"DA-Q3",sheetRef:"Q3",text:"How well understood are data volumes, growth rates, residency requirements, and encryption posture?",weight:1},{id:"DA-Q4",sheetRef:"Q4",text:"Is the lifespan and full data lifecycle \u2014 from creation to disposition \u2014 mapped and governed?",weight:1},{id:"DA-Q5",sheetRef:"Q5",text:"Are data formats proprietary or based on open, interoperable standards?",weight:1},{id:"DA-Q6",sheetRef:"Q6",text:"How open and transparent is data publication, and is a default-open approach applied where appropriate?",weight:1},{id:"DA-Q7",sheetRef:"Q7",text:"Are analytics and trend analysis capabilities available to support decision-making from current data assets?",weight:1},{id:"DA-Q8",sheetRef:"Q8",text:"How mature are data access controls, auditing mechanisms, and the ability to trace who accessed what and when?",weight:1},{id:"DA-Q9",sheetRef:"Q9",text:"How interoperable is the current data environment with other GC systems, programs, and platforms?",weight:1}],stageExpectation:{discovery:"low-ok",alpha:"low-ok"}},{id:"data-architecture-and-standards",label:"Data Architecture & Standards",weight:40,questions:[{id:"DA-Q10",sheetRef:"Q10",text:"Is there a formal, documented data model that reflects all key entities, relationships, attributes, and business rules?",weight:1},{id:"DA-Q11",sheetRef:"Q11",text:"How mature is master data management \u2014 are authoritative data sources identified, maintained, and trusted?",weight:1},{id:"DA-Q12",sheetRef:"Q12",text:"Is data lifecycle governance established, covering creation, versioning, archiving, and secure disposition?",weight:1},{id:"DA-Q13",sheetRef:"Q13",text:"Are international and GC data standards applied (e.g., ISO, DCAT, NIEM, GC Open Data Directive)?",weight:1},{id:"DA-Q14",sheetRef:"Q14",text:"How well defined is data lineage \u2014 can the origin, transformation, and movement of data be traced end-to-end?",weight:1},{id:"DA-Q15",sheetRef:"Q15",text:"Is comprehensive metadata management in place, enabling data discovery, classification, and contextual understanding?",weight:1},{id:"DA-Q16",sheetRef:"Q16",text:"How mature is data quality management \u2014 are completeness, accuracy, consistency, and timeliness measured and enforced?",weight:1},{id:"DA-Q17",sheetRef:"Q17",text:"Is data instrumentation in place to capture operational telemetry, audit records, and system-generated metadata?",weight:1},{id:"DA-Q18",sheetRef:"Q18",text:"Are data read/write performance requirements (volumes, IOPS, movement patterns) understood and architecturally addressed?",weight:1},{id:"DA-Q19",sheetRef:"Q19",text:"Is there a strategy for structured, semi-structured, and unstructured data that applies consistent governance across all types?",weight:1},{id:"DA-Q20",sheetRef:"Q20",text:"How well is data residency managed \u2014 are intentional copies of data tracked, controlled, and compliant with policy?",weight:1},{id:"DA-Q21",sheetRef:"Q21",text:"Does the architecture support event-driven data integration patterns and real-time data processing where needed?",weight:1}]},{id:"privacy-protection-and-compliance",label:"Privacy, Protection & Compliance",weight:25,questions:[{id:"DA-Q22",sheetRef:"Q22",text:"Has a Privacy Impact Assessment (PIA) been completed, and does the architecture reflect its recommendations?",weight:1},{id:"DA-Q23",sheetRef:"Q23",text:"Is Privacy by Design embedded throughout the solution, from data collection through to disposition?",weight:1},{id:"DA-Q24",sheetRef:"Q24",text:"How mature is data categorization \u2014 are all data assets classified by sensitivity, and is handling appropriate to classification?",weight:1},{id:"DA-Q25",sheetRef:"Q25",text:"Is encryption applied at rest, in transit, and in processing for all data at the appropriate sensitivity level?",weight:1},{id:"DA-Q26",sheetRef:"Q26",text:"Are data sovereignty requirements met \u2014 is there full awareness of where data resides, crosses borders, and is subject to foreign law?",weight:1},{id:"DA-Q27",sheetRef:"Q27",text:"Are data retention and disposition policies enforced, including secure deletion and legal hold capabilities?",weight:1},{id:"DA-Q28",sheetRef:"Q28",text:"How well are collection limitation principles applied \u2014 is only necessary data collected, with informed consent where required?",weight:1},{id:"DA-Q29",sheetRef:"Q29",text:"Is there a documented breach response plan, and has it been tested?",weight:1},{id:"DA-Q30",sheetRef:"Q30",text:"Are access controls enforced at the data level, ensuring role-based and attribute-based access is actively governed?",weight:1}]},{id:"accessibility-interoperability-and-usability",label:"Accessibility, Interoperability & Usability",weight:5,questions:[{id:"DA-Q31",sheetRef:"Q31",text:"Does the data architecture align with FAIR principles (Findable, Accessible, Interoperable, Reusable)?",weight:1},{id:"DA-Q32",sheetRef:"Q32",text:"Are APIs and data-sharing interfaces standards-based and documented, enabling downstream consumption without tight coupling?",weight:1},{id:"DA-Q33",sheetRef:"Q33",text:"How accessible is data to authorized consumers, including other departments, partners, and (where appropriate) the public?",weight:1}]},{id:"governance-oversight-and-accountability",label:"Governance, Oversight & Accountability",weight:20,questions:[{id:"DA-Q34",sheetRef:"Q34",text:"Is there a designated data owner and data steward for each key dataset, with documented accountability?",weight:1},{id:"DA-Q35",sheetRef:"Q35",text:"How mature is the data governance framework \u2014 does it cover policies, standards, roles, dispute resolution, and enforcement?",weight:1},{id:"DA-Q36",sheetRef:"Q36",text:"Are data governance decisions transparent and auditable, including any changes to data models, access rules, or classifications?",weight:1},{id:"DA-Q37",sheetRef:"Q37",text:"Is there a process to ensure data governance keeps pace with legislative changes (Privacy Act, Access to Information, Bill C-27)?",weight:1},{id:"DA-Q38",sheetRef:"Q38",text:"How well is data quality monitored, reported on, and escalated when thresholds are breached?",weight:1},{id:"DA-Q39",sheetRef:"Q39",text:"Is there a regular data audit process to validate compliance with policies, identify orphaned data, and assess data health?",weight:1}]}]},{id:"application",label:"Application & Virtual Architecture",weight:25,description:"Designing agile, scalable application ecosystems",sections:[{id:"defining-the-current-state",label:"Defining the Current State",weight:10,questions:[{id:"AP-Q1",sheetRef:"Q1",text:"Is the current application solution fully documented, including architecture diagrams, data flows, and integration points?",weight:1},{id:"AP-Q2",sheetRef:"Q2",text:"How well is the current system instrumented \u2014 are resource allocation, consumption, and application health monitored?",weight:1},{id:"AP-Q3",sheetRef:"Q3",text:"What is the outstanding technical debt, and is it formally tracked in a backlog with prioritization?",weight:1},{id:"AP-Q4",sheetRef:"Q4",text:"When are major software contracts expiring, and is there a renewal or replacement strategy in place?",weight:1},{id:"AP-Q5",sheetRef:"Q5",text:"What known security vulnerabilities exist in the current solution, and what is the remediation status?",weight:1},{id:"AP-Q6",sheetRef:"Q6",text:"How well understood are the delivery pipeline properties \u2014 maturity, automation, deployment frequency, and failure rate?",weight:1},{id:"AP-Q7",sheetRef:"Q7",text:"What is the degree of vendor or technology lock-in, and are exit/migration pathways understood?",weight:1},{id:"AP-Q8",sheetRef:"Q8",text:"Are all upstream and downstream application dependencies mapped and current?",weight:1},{id:"AP-Q9",sheetRef:"Q9",text:"What is the known backlog of defects, flaws, and unresolved issues, and how is it managed?",weight:1}],stageExpectation:{discovery:"low-ok",alpha:"low-ok"}},{id:"application-architecture-and-build-approach",label:"Application Architecture & Build Approach",weight:20,questions:[{id:"AP-Q10",sheetRef:"Q10",text:"Is the application type (COTS, configured, custom-built, low/no-code, assembled) clearly defined and justified?",weight:1},{id:"AP-Q11",sheetRef:"Q11",text:"Is the delivery methodology (agile, waterfall, hybrid) appropriate to the solution's context and documented?",weight:1},{id:"AP-Q12",sheetRef:"Q12",text:"How software-defined is the solution \u2014 are configuration, policy, and infrastructure managed as code?",weight:1},{id:"AP-Q13",sheetRef:"Q13",text:"Is the application designed with capabilities-based modularity, enabling components to be replaced independently?",weight:1},{id:"AP-Q14",sheetRef:"Q14",text:"How are interoperability interfaces between internal components and external applications exposed and governed?",weight:1},{id:"AP-Q15",sheetRef:"Q15",text:"Is intellectual property ownership clear, and are code licensing obligations tracked and managed?",weight:1},{id:"AP-Q16",sheetRef:"Q16",text:"How mature is code reuse \u2014 is there a shared code repository, automated integration, and published component catalogue?",weight:1},{id:"AP-Q17",sheetRef:"Q17",text:"What is the lowest required integration level (container, VM/OS, physical hardware), and is it minimized where possible?",weight:1},{id:"AP-Q18",sheetRef:"Q18",text:"Are volume, redundancy, elasticity, scalability, throttling, and observability requirements defined and implemented?",weight:1},{id:"AP-Q19",sheetRef:"Q19",text:"Is the application designed as external-facing, internal enterprise, or administrative \u2014 and is the design tailored accordingly?",weight:1}]},{id:"engineering-practices-and-frameworks",label:"Engineering Practices & Frameworks",weight:20,questions:[{id:"AP-Q20",sheetRef:"Q20",text:"How mature is the DevSecOps pipeline \u2014 including continuous integration, continuous deployment, automated testing, and security gates?",weight:1},{id:"AP-Q21",sheetRef:"Q21",text:"Is test coverage defined, measured, and enforced \u2014 including unit, integration, regression, performance, and security testing?",weight:1},{id:"AP-Q22",sheetRef:"Q22",text:"How well are coding standards, frameworks, and languages documented, enforced, and aligned with GC guidance?",weight:1},{id:"AP-Q23",sheetRef:"Q23",text:"Are accessibility standards (WCAG 2.1 AA or equivalent) embedded in the development and QA process?",weight:1},{id:"AP-Q24",sheetRef:"Q24",text:"Is there an algorithmic impact assessment (AIA) process in place for any AI/ML components in the application?",weight:1},{id:"AP-Q25",sheetRef:"Q25",text:"How mature is the code review and peer review process, and is it consistently applied?",weight:1},{id:"AP-Q26",sheetRef:"Q26",text:"Are application performance benchmarks established, tested against in CI/CD, and used to gate deployments?",weight:1},{id:"AP-Q27",sheetRef:"Q27
