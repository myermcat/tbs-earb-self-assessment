<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The security story is this line. default-src 'none' plus connect-src 'none' means the page
  cannot fetch, XHR, open a websocket, load an image from a host, or submit a form anywhere.
  Everything it needs is inlined below. It works with the network cable pulled out.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232a6fbd%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%236c4bb0%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2242%22%20width%3D%228%22%20height%3D%2210%22%20rx%3D%222%22%20fill%3D%22%23fff%22%20opacity%3D%22.45%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2234%22%20width%3D%228%22%20height%3D%2218%22%20rx%3D%222%22%20fill%3D%22%23fff%22%20opacity%3D%22.62%22%2F%3E%3Crect%20x%3D%2236%22%20y%3D%2225%22%20width%3D%228%22%20height%3D%2227%22%20rx%3D%222%22%20fill%3D%22%23fff%22%20opacity%3D%22.8%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2214%22%20width%3D%228%22%20height%3D%2238%22%20rx%3D%222%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<title>GC Enterprise Architecture self-assessment</title>
<style>/* ==========================================================================================
   GC EA self-assessment
   One stylesheet, inlined into the built file. No web fonts, no CDN - the page has to work
   with the network cable out, so everything here is self-contained.
   ========================================================================================== */

:root {
  /*
   * Ties native widget rendering - buttons, inputs, selects, scrollbars - to the same signal
   * the tokens below use. Without it the controls follow the OS setting while the page follows
   * the media query, and a light page ends up with dark buttons.
   */
  color-scheme: light;

  /* Neutrals */
  --bg:        #f7f8fa;
  --surface:   #ffffff;
  --surface-2: #f1f3f6;
  --line:      #e2e6ec;
  --line-2:    #cdd4dd;
  --ink:       #16191d;
  --ink-2:     #4a5361;
  --ink-3:     #79828f;

  /* Accent */
  --accent:      #2a4b8d;
  --accent-ink:  #ffffff;
  --accent-soft: #eaf0fb;
  --accent-line: #b9caea;

  /* Dan's eleven score colours, as an even ramp */
  --s0:  #1b1d21;  --s1:  #7f1d1d;  --s2:  #c0392b;  --s3:  #d97528;
  --s4:  #d9a520;  --s5:  #c9b528;  --s6:  #8faa23;  --s7:  #3f8f4a;
  --s8:  #1f6b3c;  --s9:  #2a6fbd;  --s10: #6c4bb0;

  /* Semantic */
  --good:      #1f6b3c;
  --good-bg:   #e9f4ed;
  --warn:      #a8620a;
  --warn-bg:   #fdf3e3;
  --bad:       #b3261e;
  --bad-bg:    #fdecea;
  --info:      #2a4b8d;

  --radius:    10px;
  --radius-sm: 6px;
  --shadow:    0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 4px 12px rgba(16, 24, 40, .08), 0 1px 3px rgba(16, 24, 40, .06);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg:        #101216;
    --surface:   #191c22;
    --surface-2: #21252d;
    --line:      #2b303a;
    --line-2:    #3a4150;
    --ink:       #e8eaee;
    --ink-2:     #a8b0bd;
    --ink-3:     #7b8492;
    --accent:      #6f96e0;
    --accent-ink:  #101216;
    --accent-soft: #1b2436;
    --accent-line: #2f4570;
    --good: #5fbf82; --good-bg: #14251b;
    --warn: #e0a34a; --warn-bg: #2a2113;
    --bad:  #f08279; --bad-bg:  #2b1614;
    --shadow:    0 1px 2px rgba(0, 0, 0, .4);
    --shadow-lg: 0 6px 18px rgba(0, 0, 0, .45);
  }
}

* { box-sizing: border-box; }

/* Content that exists only on paper: answers, reasoning and evidence that live in form
   controls on screen, and form controls do not print their values. */
.print-only { display: none; }

/* Visible to a screen reader, not on screen. Used to carry "out of 10" beside a score pill. */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* A heading and its score, side by side, with the score outside the heading. */
.head-row { display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  accent-color: var(--accent);
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.25; letter-spacing: -.011em; font-weight: 650; }
h1 { font-size: 1.55rem; }
h2 { font-size: 1.12rem; }
h3 { font-size: .98rem; }
h4 { font-size: .9rem; }
p  { margin: 0 0 .65rem; }
p:last-child { margin-bottom: 0; }
a  { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
ul { margin: .4rem 0; padding-left: 1.15rem; }
li { margin-bottom: .22rem; }

.muted { color: var(--ink-2); }
.dim   { color: var(--ink-3); }
.small { font-size: .855rem; }
.tiny  { font-size: .78rem; }
.warn-text { color: var(--warn); }
.mono { font-family: var(--mono); font-size: .82rem; }

/* ---------- shell ------------------------------------------------------------------------ */

/* Header and marking banner as one sticky block, so neither can cover the other. */
.chrome { position: sticky; top: 0; z-index: 30; }

.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  padding: .55rem 1.25rem;
  background: var(--surface);
  border-bottom: 1px solid var(--line-2);
  box-shadow: 0 6px 16px -10px rgba(16, 24, 40, .35);
}
@media (prefers-color-scheme: dark) {
  .topbar { box-shadow: 0 8px 20px -12px rgba(0, 0, 0, .8); }
}
.brand { display: flex; align-items: center; gap: .55rem; cursor: pointer; min-width: 0; }
.brand-mark {
  width: 26px; height: 26px; flex: 0 0 26px; border-radius: 7px;
  background: linear-gradient(140deg, var(--s9), var(--s10));
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: .72rem;
  letter-spacing: -.03em;
}
.brand strong { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .ver { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }

.topbar-right { display: flex; align-items: center; gap: .8rem; }
.topbar nav.path { display: flex; align-items: center; gap: .1rem; background: var(--surface-2);
  padding: .18rem .3rem; border-radius: 9px; border: 1px solid var(--line); }
.chev { color: var(--ink-3); font-size: .9rem; padding: 0 .05rem; user-select: none; }

.icon-btn { display: grid; place-items: center; width: 33px; height: 33px; padding: 0;
  border-radius: 9px; color: var(--ink-2); border: 1px solid var(--line); background: var(--surface); }
.icon-btn:hover { color: var(--ink); }
.icon-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tab {
  border: 0; background: transparent; color: var(--ink-2);
  padding: .34rem .8rem; border-radius: 7px; font-size: .875rem; font-weight: 550; cursor: pointer;
  transition: background .12s, color .12s;
}
.tab:hover { color: var(--ink); }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.body { max-width: 940px; margin: 1.15rem auto 6rem; padding: 0 1.15rem; }
.sitefoot { text-align: center; color: var(--ink-3); font-size: .78rem; padding: .5rem 1rem 2.5rem; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.05rem 1.15rem; margin-bottom: .85rem; box-shadow: var(--shadow);
}
.card.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--warn-bg); }
.card.tight { padding: .6rem .8rem; }

/* ---------- controls -------------------------------------------------------------------- */

button, .filelabel {
  font: inherit; font-size: .885rem; font-weight: 550; cursor: pointer;
  border-radius: 8px; padding: .44rem .9rem; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink);
  transition: background .12s, border-color .12s, box-shadow .12s;
}
button:hover:not(:disabled), .filelabel:hover { border-color: var(--accent-line); background: var(--accent-soft); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
button.ghost { background: var(--surface); }
button.small, .filelabel.small { padding: .2rem .55rem; font-size: .8rem; border-radius: 6px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
summary:focus-visible, .filelabel:focus-within {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.filelabel { display: inline-block; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

.field { display: block; margin-bottom: .75rem; }
.field > span { display: block; font-size: .82rem; font-weight: 550; color: var(--ink-2); margin-bottom: .25rem; }
input[type=text], input[type=number], textarea, select {
  font: inherit; font-size: .9rem; width: 100%; padding: .45rem .6rem;
  border: 1px solid var(--line-2); border-radius: 8px;
  background: var(--surface); color: var(--ink);
}
input::placeholder, textarea::placeholder { color: var(--ink-3); }
input[type=number] { width: 4.4rem; }
textarea { resize: vertical; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0 1rem; }

/* ---------- stepper --------------------------------------------------------------------- */

.stepper { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: .45rem; margin-bottom: .9rem; }
.step {
  display: flex; flex-direction: column; align-items: stretch; gap: .3rem;
  padding: .5rem .7rem; border-radius: var(--radius); text-align: left;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.step.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.step.complete { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.step-label { font-size: .885rem; font-weight: 600; }
.step-count { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }
.step-bar { height: 3px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.step-bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px;
  transition: width .2s ease; }
.step.complete .step-bar i { background: var(--good); }

/* ---------- home ------------------------------------------------------------------------ */

/**
 * The start page is meant to be one screen with nothing below the fold, so the shell becomes
 * a fixed-height column and the content centres inside it. A short or narrow viewport cannot
 * hold it, so scrolling comes back there.
 */
.app-home { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.app-home .body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  justify-content: center; overflow: hidden; margin: 0 auto; padding: 1rem 1.15rem; }
.app-home .sitefoot { flex: 0 0 auto; padding: .5rem 1rem 1rem; }

@media (max-width: 760px), (max-height: 640px) {
  .app-home { height: auto; overflow: visible; }
  .app-home .body { overflow: visible; justify-content: flex-start; padding: 1rem 1.15rem 3rem; }
}

.body-home { max-width: 900px; }

.hero {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 2.2rem 2.1rem; margin: 0 0 .9rem; box-shadow: var(--shadow-lg);
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0 auto 0 0; width: 4px;
  background: linear-gradient(180deg, var(--s2), var(--s5), var(--s7), var(--s9), var(--s10));
}
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: .5rem; }
.hero h1 { font-size: 2.15rem; letter-spacing: -.022em; margin-bottom: .6rem; }
.hero .lead { font-size: 1.06rem; color: var(--ink-2); max-width: 44ch; margin-bottom: 1.3rem; }
.hero-actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: baseline; }
button.big { font-size: .98rem; padding: .62rem 1.4rem; border-radius: 9px;
  display: inline-flex; align-items: center; gap: .5rem; }
button.big .arrow { font-size: 1.05rem; transition: transform .15s ease; }
button.big:hover .arrow { transform: translateX(3px); }
.or { color: var(--ink-3); font-size: .88rem; }
.filelabel-plain { background: none; border: 0; padding: 0; font-size: .88rem; cursor: pointer; }

/* The maturity ladder from the favicon, at rest. Decorative only. */
.hero-art { display: flex; align-items: flex-end; gap: .4rem; height: 118px; }
.hero-art .rung { width: 16px; border-radius: 5px; display: block; }
.hero-art .r1 { height: 26%;  background: var(--s2); opacity: .55; }
.hero-art .r2 { height: 44%;  background: var(--s4); opacity: .65; }
.hero-art .r3 { height: 62%;  background: var(--s6); opacity: .75; }
.hero-art .r4 { height: 82%;  background: var(--s8); opacity: .85; }
.hero-art .r5 { height: 100%; background: var(--s10); }

.note { background: transparent; border: 0; padding: .2rem .3rem 0; }
.note h2 { font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: .5rem; }
.note ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .45rem; }
.note li { font-size: .89rem; color: var(--ink-2); padding-left: .9rem; position: relative; }
.note li::before { content: ''; position: absolute; left: 0; top: .58em; width: 4px; height: 4px;
  border-radius: 999px; background: var(--line-2); }
.note li b { color: var(--ink); font-weight: 600; }

button.linkish { background: none; border: 0; padding: 0; color: var(--accent);
  font-size: inherit; font-weight: inherit; text-decoration: underline;
  text-underline-offset: 2px; }
button.linkish:hover { background: none; border: 0; filter: brightness(1.15); }

dl.kv { display: grid; grid-template-columns: auto 1fr; gap: .2rem .9rem; margin: 0 0 .7rem;
  font-size: .89rem; }
dl.kv dt { color: var(--ink-3); font-weight: 600; }
dl.kv dd { margin: 0; }

@media (max-width: 700px) {
  .hero { grid-template-columns: 1fr; padding: 1.6rem 1.3rem; gap: 1.2rem; }
  .hero h1 { font-size: 1.75rem; }
  .hero-art { height: 76px; }
}

code.mono { background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 4px; padding: .02rem .3rem; }

/* ---------- lifecycle stage picker ------------------------------------------------------ */

.stage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: .45rem; }
.stage-card {
  display: flex; gap: .55rem; align-items: flex-start; cursor: pointer;
  border: 1px solid var(--line); border-radius: var(--radius); padding: .6rem .7rem;
  background: var(--surface); transition: border-color .12s, box-shadow .12s;
}
.stage-card:hover { border-color: var(--accent-line); }
.stage-card:has(input:checked) { border-color: var(--accent); background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent); }
.stage-card input { width: auto; margin-top: .25rem; flex: 0 0 auto; }
.stage-card strong { font-size: .9rem; }
.dlg-link { display: inline-block; font-size: .78rem; margin-top: .25rem; }

/* ---------- questions ------------------------------------------------------------------- */

.card.section { padding: .35rem .75rem; }
.section-summary {
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  padding: .55rem .1rem; cursor: pointer; list-style: none;
}
.section-summary::-webkit-details-marker { display: none; }
.section-summary::before {
  content: ''; width: 0; height: 0; flex: 0 0 auto;
  border-left: 5px solid var(--ink-3); border-top: 4px solid transparent; border-bottom: 4px solid transparent;
  transition: transform .15s; transform-origin: 25% 50%;
}
details[open] > .section-summary::before { transform: rotate(90deg); }
.section-title { font-weight: 650; flex: 1 1 13rem; font-size: .95rem; }

.question { border-top: 1px solid var(--line); padding: .85rem 0 .5rem; }
.question:first-of-type { border-top: 0; }
.q-head { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .2rem; }
.qid { font-family: var(--mono); font-size: .7rem; color: var(--ink-3);
  border: 1px solid var(--line); border-radius: 4px; padding: .05rem .3rem; flex: 0 0 auto; }
.q-text { font-weight: 550; flex: 1 1 20rem; }

.badge { font-size: .72rem; font-weight: 600; padding: .08rem .42rem; border-radius: 999px;
  border: 1px solid; white-space: nowrap; }
.badge-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-bg); }
.badge-soft { color: var(--ink-3); border-color: var(--line); background: var(--surface-2); }

.ladder-box { margin: .25rem 0 .5rem; font-size: .855rem; }
.ladder-box summary { cursor: pointer; color: var(--accent); font-weight: 550; }
.ladder { margin: .45rem 0; padding-left: 0; list-style: none; }
.ladder li { display: grid; grid-template-columns: 1.5rem auto; gap: .5rem; margin-bottom: .3rem; }
.ladder b { font-family: var(--mono); text-align: right; }

/* the 0-10 selector, in Dan's colours */
.score-line { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .5rem 0 .35rem; }
.score-row { display: flex; gap: .2rem; flex-wrap: wrap; align-items: center; }
.score-btn[aria-disabled='true'] { opacity: .3; }
.score-btn {
  width: 2.05rem; padding: .3rem 0; text-align: center; border-radius: 7px;
  font-family: var(--mono); font-size: .82rem; font-weight: 600;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2);
}
.score-btn:hover:not(:disabled) { border-color: currentColor; }
.score-btn.on { color: #fff; border-color: transparent; box-shadow: var(--shadow); }
.score-btn.on.v0  { background: var(--s0); }  .score-btn.on.v1  { background: var(--s1); }
.score-btn.on.v2  { background: var(--s2); }  .score-btn.on.v3  { background: var(--s3); }
.score-btn.on.v4  { background: var(--s4); }  .score-btn.on.v5  { background: var(--s5); }
.score-btn.on.v6  { background: var(--s6); }  .score-btn.on.v7  { background: var(--s7); }
.score-btn.on.v8  { background: var(--s8); }  .score-btn.on.v9  { background: var(--s9); }
.score-btn.on.v10 { background: var(--s10); }
.score-btn:disabled { opacity: .3; }
.na { font-size: .83rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: .3rem;
  cursor: pointer; }
.na input { width: auto; }
.chosen { font-size: .84rem; color: var(--ink-2); margin: 0 0 .5rem; padding-left: .1rem; }
.chosen b { color: var(--ink); }

/* ---------- evidence -------------------------------------------------------------------- */

.evidence { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: .55rem .65rem; margin: .5rem 0 .2rem; }
.ev-head { display: flex; gap: .5rem; flex-wrap: wrap; align-items: baseline; margin-bottom: .3rem; }
.ev-head strong { font-size: .85rem; }
.ev-item { border-top: 1px dashed var(--line-2); padding: .45rem 0; }
.ev-item:first-of-type { border-top: 0; padding-top: .1rem; }
.ev-item.unmarked { background: var(--bad-bg); border-radius: var(--radius-sm);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--bad) 30%, transparent); padding: .45rem .5rem; }
.ev-row  { display: grid; grid-template-columns: 1.6fr .85fr 1.15fr auto; gap: .3rem; }
.ev-row2 { display: grid; grid-template-columns: auto 1fr; gap: .35rem; margin-top: .3rem; align-items: center; }
.att { display: inline-flex; align-items: center; gap: .4rem; background: var(--good-bg);
  border: 1px solid color-mix(in srgb, var(--good) 35%, transparent);
  border-radius: 7px; padding: .18rem .4rem; }
.att-name { font-weight: 600; font-size: .83rem; max-width: 15rem; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.ev-list { padding-left: 1.1rem; }
select.needs-marking { border-color: var(--bad); background: var(--bad-bg); }

/* ---------- marking --------------------------------------------------------------------- */

.marking-banner {
  text-align: center; font-weight: 800; letter-spacing: .14em; font-size: .7rem;
  padding: .26rem; background: var(--ink); color: var(--bg); text-transform: uppercase;
  border-bottom: 1px solid var(--line);
}

/**
 * Unmarked is a dark plate with a red glow, so it reads as a warning light. Flat red on a
 * full-width strip was loud enough to be tuned out.
 */
.marking-banner.unmarked {
  background: #1b0e0e;
  color: #ff9d92;
  border-bottom: 1px solid rgba(255, 90, 70, .55);
  box-shadow: 0 0 22px rgba(200, 40, 30, .55), inset 0 0 26px rgba(190, 35, 25, .30);
  text-shadow: 0 0 10px rgba(255, 110, 90, .75);
  animation: marking-pulse 2.6s ease-in-out infinite;
}
@keyframes marking-pulse {
  0%, 100% { box-shadow: 0 0 16px rgba(200, 40, 30, .40), inset 0 0 20px rgba(190, 35, 25, .22); }
  50%      { box-shadow: 0 0 30px rgba(220, 50, 40, .72), inset 0 0 32px rgba(200, 40, 30, .38); }
}
@media (prefers-reduced-motion: reduce) {
  .marking-banner.unmarked { animation: none; }
}

.marking-banner.print-only { display: none; }
.marking-row { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .45rem; }
.marking-chip {
  display: inline-flex; align-items: center; gap: .35rem; cursor: pointer;
  border: 1px solid var(--line-2); border-radius: 999px; padding: .28rem .75rem;
  background: var(--surface); font-size: .865rem;
}
.marking-chip:hover { border-color: var(--accent-line); }
.marking-chip.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600;
  box-shadow: 0 0 0 1px var(--accent); }
.marking-chip input { width: auto; }
.marking-inline { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; border: 1px solid var(--ink-2); color: var(--ink-2);
  padding: .05rem .4rem; border-radius: 4px; margin-top: .3rem; }
.marking-inline.unmarked { border-color: var(--bad); color: var(--bad); }

/* ---------- sticky footer --------------------------------------------------------------- */

.sticky-footer {
  position: sticky; bottom: .6rem; z-index: 25;
  background: var(--surface-2);
  border: 1px solid var(--line-2);
  border-top: 2px solid var(--accent);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow:
    0 -14px 28px -12px rgba(16, 24, 40, .30),   /* lifts it off the content behind */
    0 2px 6px rgba(16, 24, 40, .10);
}
@media (prefers-color-scheme: dark) {
  .sticky-footer {
    box-shadow:
      0 -16px 32px -10px rgba(0, 0, 0, .70),
      0 0 0 1px rgba(255, 255, 255, .04);
  }
}
.footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  flex-wrap: wrap; padding: .5rem .8rem; }
.sticky-footer .pill { background: var(--surface); }
.footer-score { display: flex; align-items: center; gap: .6rem; }
.footer-actions { display: flex; gap: .45rem; }
.gate { background: var(--warn-bg); border-bottom: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
  color: var(--warn); padding: .35rem .8rem; font-size: .84rem; }

/* ---------- scores ---------------------------------------------------------------------- */

.pill { display: inline-grid; place-items: center; min-width: 2.5rem; font-family: var(--mono);
  font-weight: 700; font-size: .85rem; padding: .12rem .45rem; border-radius: 999px;
  border: 1px solid currentColor; }
.pill.small { min-width: 1.95rem; font-size: .78rem; }
.t0  { color: var(--s0);  } .t1  { color: var(--s1);  } .t2  { color: var(--s2);  }
.t3  { color: var(--s3);  } .t4  { color: var(--s4);  } .t5  { color: var(--s5);  }
.t6  { color: var(--s6);  } .t7  { color: var(--s7);  } .t8  { color: var(--s8);  }
.t9  { color: var(--s9);  } .t10 { color: var(--s10); }
.tnone { color: var(--ink-3); }
td.t0, td.t1, td.t2, td.t3, td.t4, td.t5, td.t6, td.t7, td.t8, td.t9, td.t10 { font-weight: 700; }

.headline { display: flex; gap: 1.15rem; align-items: flex-start; flex-wrap: wrap; }
.bigscore { flex: 0 0 auto; border-radius: var(--radius); padding: .7rem 1.15rem; text-align: center;
  border: 1px solid currentColor; background: var(--surface-2); }
.bigscore .num { display: block; font-size: 2.5rem; font-weight: 750; line-height: 1;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.bigscore .outof { font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 650; }
.headline-text { flex: 1 1 20rem; min-width: 0; }

.band, .maturity { border-left: 3px solid; padding: .45rem .7rem; margin: .55rem 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.band.good    { border-color: var(--good); background: var(--good-bg); }
.band.neutral { border-color: var(--ink-3); background: var(--surface-2); }
.band.bad     { border-color: var(--bad);  background: var(--bad-bg); }
.maturity     { border-color: var(--accent); background: var(--accent-soft); }

.bar-row { display: grid; grid-template-columns: minmax(9rem, 14rem) 1fr 3.2rem; gap: .7rem;
  align-items: center; margin-bottom: .45rem; }
.bar-label { font-size: .885rem; }
.bar-track { background: var(--surface-2); border-radius: 999px; height: .55rem; overflow: hidden;
  box-shadow: inset 0 0 0 1px var(--line); }
.bar-fill { height: 100%; border-radius: 999px; transition: width .25s ease; }
.b0{background:var(--s0)} .b1{background:var(--s1)} .b2{background:var(--s2)} .b3{background:var(--s3)}
.b4{background:var(--s4)} .b5{background:var(--s5)} .b6{background:var(--s6)} .b7{background:var(--s7)}
.b8{background:var(--s8)} .b9{background:var(--s9)} .b10{background:var(--s10)}
.bnone{background:var(--line-2)}
.bar-num { text-align: right; font-family: var(--mono); font-weight: 700; font-size: .87rem; }

.backlog-item { border-top: 1px solid var(--line); padding: .7rem 0; }
.backlog-item:first-of-type { border-top: 0; }
.steps { margin: .35rem 0; padding-left: 1.15rem; }

/* ---------- flags ----------------------------------------------------------------------- */

.flag { border-left: 3px solid var(--line-2); background: var(--surface-2);
  padding: .5rem .7rem; margin-bottom: .45rem; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.flag.sev-high   { border-color: var(--bad);  background: var(--bad-bg); }
.flag.sev-medium { border-color: var(--warn); background: var(--warn-bg); }
.flag.sev-low    { border-color: var(--ink-3); }
.flag.sev-info   { border-color: var(--accent); background: var(--accent-soft); }
.flag-title { display: flex; align-items: baseline; gap: .4rem; flex-wrap: wrap; }
.challenge { font-style: italic; margin-top: .25rem; padding-left: .5rem;
  border-left: 2px solid color-mix(in srgb, currentColor 35%, transparent); }
.sev-dot { width: .5rem; height: .5rem; border-radius: 999px; flex: 0 0 auto; background: currentColor; }

/* ---------- tables ---------------------------------------------------------------------- */

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: .875rem; }
th, td { text-align: left; padding: .4rem .55rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3);
  font-weight: 650; background: var(--surface); position: sticky; top: 0; }
td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.domain-row td { background: var(--surface-2); font-weight: 700; }
.section-row td { background: color-mix(in srgb, var(--surface-2) 55%, var(--surface));
  font-weight: 600; font-size: .82rem; color: var(--ink-2); }
.triage tbody tr:hover { background: var(--accent-soft); }

/* ---------- reviewer -------------------------------------------------------------------- */

.dropzone { border: 1.5px dashed var(--line-2); }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.15rem; }
.audit-row { border-top: 1px solid var(--line); padding: .6rem 0; }
.audit-row.flagged { background: var(--warn-bg); border-radius: var(--radius-sm);
  padding: .6rem .6rem; box-shadow: inset 3px 0 0 var(--warn); }
.audit-row.changed { box-shadow: inset 3px 0 0 var(--accent); background: var(--accent-soft);
  border-radius: var(--radius-sm); padding: .6rem; }
.said { background: var(--surface-2); border-left: 2px solid var(--line-2);
  padding: .3rem .55rem; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.audit-controls { display: flex; gap: .45rem; align-items: center; flex-wrap: wrap; margin-top: .45rem; }
.audit-controls label { font-size: .83rem; color: var(--ink-2); display: flex; align-items: center; gap: .3rem; }
.audit-controls select, .audit-controls input[type=text] { width: auto; flex: 1 1 8rem; }
.delta { font-family: var(--mono); font-size: .8rem; font-weight: 700; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
.section-head { display: flex; align-items: center; gap: .5rem; margin: 1rem 0 .3rem;
  padding-bottom: .25rem; border-bottom: 1px solid var(--line); }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .5rem;
  margin-bottom: .2rem; }
.kpi { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: .5rem .65rem; }
.kpi-num { display: block; font-family: var(--mono); font-size: 1.35rem; font-weight: 700; line-height: 1.1; }
.kpi-label { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3);
  font-weight: 650; }

/* ---------- print ----------------------------------------------------------------------- */

@media print {
  .topbar, .sticky-footer, .actions, .sitefoot, .stepper, button, .filelabel { display: none !important; }
  input, select, textarea, .score-row, .chosen, .evidence .ev-item, .ev-head, .note-secure { display: none !important; }
  .print-only { display: block; }
  ul.print-only { display: block; padding-left: 1.1rem; }
  .print-answer { font-weight: 700; margin: .2rem 0; }
  .print-said { margin: .1rem 0 .2rem; }
  .print-evidence { margin: .1rem 0 .3rem; font-size: 10pt; }
  .field > span { font-weight: 600; }
  .field:has(textarea) > span, .field:has(input) > span, .field:has(select) > span { display: none; }
  body { background: #fff; color: #000; font-size: 11pt; }

  /* A section holding 14 questions can never honour break-inside: avoid, so the rule moves
     down onto the question, which is a size a page can actually keep together. */
  .card { border: 0; box-shadow: none; padding: 0 0 .7rem; margin: 0 0 .7rem; break-inside: auto; }
  .question { break-inside: avoid; }
  .marking-banner { position: static; background: none !important; color: #000 !important;
    border-bottom: 2px solid #000; }
  /* Sections are forced open by openEverythingForPrint() before the dialog, because CSS
     cannot reveal a closed <details>. The summary stays visible: it carries the title. */
  .section-summary::before { display: none; }
  .section-summary { break-after: avoid; }
  .body { max-width: none; margin: 0; padding: 0; }
  a { color: #000; }
}

@media (max-width: 620px) {
  .ev-row { grid-template-columns: 1fr 1fr; }
  .bar-row { grid-template-columns: 1fr 3.2rem; }
  .bar-track { grid-column: 1 / -1; }
  .headline { gap: .8rem; }
  .bigscore .num { font-size: 2rem; }
}

bilities are missing, and manual workarounds are the only way to achieve business outcomes."},{value:1,colour:"Dark Red",name:"Critical Gaps",label:"A skeleton exists, but core capabilities (like security or data integrity) are missing. High risk of systemic failure."},{value:2,colour:"Red",name:"Fragmented",label:'Capabilities exist in "silos." They are inconsistent, undocumented, and require constant manual intervention to stay synchronized.'},{value:3,colour:"Orange",name:"Emergent",label:'Core capabilities are present but brittle. The architecture meets the "happy path" but fails under stress or edge cases.'},{value:4,colour:"Orange-Yellow",name:"Defined",label:"The architecture meets basic functional requirements. Documentation exists, but Quality Attributes (scalability, maintainability) are an afterthought."},{value:5,colour:"Yellow",name:"Integrated",label:"This is the Baseline. All desired capabilities are present and connected. The system is stable and performs as expected under normal conditions."},{value:6,colour:"Yellow-Green",name:"Managed",label:"Capabilities are monitored and measured. The architecture can handle predictable growth and has basic fault tolerance."},{value:7,colour:"Green",name:"Scalable & Secure",label:'The architecture is "hardened." It handles bursts in demand effortlessly and has proactive security measures built into the design.'},{value:8,colour:"Dark Green",name:"Agile/Extensible",label:"The architecture is modular. Adding a new desired capability does not require a rewrite; the system is designed to be plugged into and extended."},{value:9,colour:"Blue",name:"Predictive",label:"The architecture uses telemetry and AI/ML to anticipate needs (e.g., auto-scaling before a spike or self-healing before a crash)."},{value:10,colour:"Purple",name:"Symbiotic",label:'The "North Star" state. The architecture and business strategy are one. The system is so flexible it can pivot to entirely new business models with minimal architectural friction.'}]},maturityBands:[{min:9,label:"Leading Practice",detail:"Predictive, self-optimizing, fully aligned with business strategy."},{min:7,label:"Advanced",detail:"Hardened, scalable, and modular. Demonstrably high-quality architecture."},{min:5,label:"Baseline Ready",detail:"Core capabilities present and stable. Meets minimum GC EA expectations."},{min:3,label:"Developing",detail:"Foundational elements exist but architecture is immature and at risk under stress."},{min:0,label:"Critical Risk",detail:"Immediate intervention required. Core capabilities absent or severely compromised."}],maturityBandsNote:"Dan's own reference guide, from the Summary Dashboard sheet.",bands:[{id:"showcase",min:8.5,label:"Showcase",routing:"No board slot needed. TBS may ask to showcase this work.",tone:"good"},{id:"hallpass",min:6,label:"Hall pass",routing:"Suggested: no GC EARB appearance required. Subject to audit sample.",tone:"good"},{id:"routine",min:3,label:"Routine",routing:"Suggested: no board time. Assessor spot-check only.",tone:"neutral"},{id:"attend",min:0,label:"Bring it to the board",routing:"Suggested: attend GC EARB. Come and tell us why, and what the plan is.",tone:"bad"}],bandsNote:"ROUTING, not maturity. These are Dan's spoken numbers from 2026-08-26 (60% hall pass, 8.5 showcase, ~2 come and explain) and are NOT in his workbook or signed off by anyone. Maturity labels above are his.",stageMultipliers:{"low-ok":.25,expected:1,critical:1.5},stageMultipliersNote:'Our addition. Lifecycle stage is not captured in the current process at all - Dan named it as the key missing field. Only "Defining the Current State" sections carry a rule so far.',lifecycleStages:[{id:"discovery",label:"Create - Discovery",dlgPage:"Create phase",blurb:"Understanding the problem. There may be no current solution to describe yet."},{id:"alpha",label:"Create - Alpha",dlgPage:"Create phase",blurb:"Testing whether an approach can work, with real users."},{id:"beta",label:"Create - Beta",dlgPage:"Create phase",blurb:"Building the real thing in public, at growing scale."},{id:"stabilization",label:"Live - Stabilization",dlgPage:"Live phase",blurb:"In service, settling down. Costs and operations should be known."},{id:"growth",label:"Live - Growth",dlgPage:"Live phase",blurb:"In service, scaling up."},{id:"maturity",label:"Live - Maturity",dlgPage:"Live phase",blurb:"In service, steady state. Everything should be documented and measured."},{id:"sunset",label:"Sunset",dlgPage:"Sunset phase",blurb:"Replacing or retiring. Dependencies and data disposition matter most."}],domains:[{id:"business",label:"Business Architecture",weight:25,description:"Connecting strategy to execution through structured design",sections:[{id:"defining-the-current-state",label:"Defining the Current State",weight:5,questions:[{id:"BU-Q1",sheetRef:"Q1",text:"How thoroughly has the current state of this solution been documented, including all processes, data flows, and system dependencies?",weight:1},{id:"BU-Q2",sheetRef:"Q2",text:"What entities (data objects, records, clients, files) are currently produced, managed, or maintained by this solution?",weight:1},{id:"BU-Q3",sheetRef:"Q3",text:"Have all roles and responsibilities across stakeholders, operators, and service consumers been identified, documented, and formally accepted?",weight:1},{id:"BU-Q4",sheetRef:"Q4",text:"How well understood is the criticality of this solution to Government of Canada program delivery and citizen outcomes?",weight:1},{id:"BU-Q5",sheetRef:"Q5",text:"Are all sub-components of the current solution assessed for their individual criticality, availability, and risk exposure?",weight:1},{id:"BU-Q6",sheetRef:"Q6",text:"What is the current level of utilization and demand for the solution (transaction volumes, active users, peak load)?",weight:1},{id:"BU-Q7",sheetRef:"Q7",text:"What is the known availability, uptime, and service continuity record of the current solution?",weight:1},{id:"BU-Q8",sheetRef:"Q8",text:"How well understood are the total lifecycle costs \u2014 including build, operate, maintain, and decommission \u2014 of the current solution?",weight:1},{id:"BU-Q9",sheetRef:"Q9",text:"What are the current unit economics (cost per transaction, cost per entity managed) and how are they tracked?",weight:1},{id:"BU-Q10",sheetRef:"Q10",text:"How mature and current are the performance indicators for this solution, and what trends do they reflect?",weight:1},{id:"BU-Q11",sheetRef:"Q11",text:"Is the lifespan and full lifecycle of the solution mapped out, and is the current position within that lifecycle known?",weight:1},{id:"BU-Q12",sheetRef:"Q12",text:"What major events (technology refresh, contract renewal, legislative changes) are on the horizon for this solution?",weight:1},{id:"BU-Q13",sheetRef:"Q13",text:"How well understood are the specific skills, staffing levels, and capacity requirements to operate and evolve this solution?",weight:1},{id:"BU-Q14",sheetRef:"Q14",text:"How are universal requirements \u2014 accessibility, official languages, inclusion, and privacy \u2014 currently addressed in the solution?",weight:1}],stageExpectation:{discovery:"low-ok",alpha:"low-ok"}},{id:"defining-the-business-solution",label:"Defining the Business Solution",weight:25,questions:[{id:"BU-Q15",sheetRef:"Q15",text:"How clearly and completely has the core business problem been defined and agreed upon by all stakeholders?",weight:1},{id:"BU-Q16",sheetRef:"Q16",text:"Is there a documented business case that articulates the expected value, outcomes, and measurable benefits of the proposed solution?",weight:1},{id:"BU-Q17",sheetRef:"Q17",text:"How well do the proposed solution capabilities map to the GC Business Capability Model and existing enterprise services?",weight:1},{id:"BU-Q18",sheetRef:"Q18",text:"Have value streams been fully mapped, showing how business capabilities deliver outcomes to clients and citizens?",weight:1},{id:"BU-Q19",sheetRef:"Q19",text:"Is the solution design driven by defined user personas, journeys, and evidence-based user research?",weight:1},{id:"BU-Q20",sheetRef:"Q20",text:"How clearly are the target service levels, response times, and quality benchmarks defined for the proposed solution?",weight:1},{id:"BU-Q21",sheetRef:"Q21",text:"Has the solution's criticality to GC program delivery been assessed, and does the architecture reflect that criticality?",weight:1},{id:"BU-Q22",sheetRef:"Q22",text:"Is there a funding model and sourcing strategy that is sustainable across the full lifecycle of the solution?",weight:1},{id:"BU-Q23",sheetRef:"Q23",text:"How well is the talent strategy defined, including required skills, existing capacity, training pipeline, and long-term retention?",weight:1},{id:"BU-Q24",sheetRef:"Q24",text:"Is a demand forecast available, and does the solution design account for projected growth and usage variability?",weight:1},{id:"BU-Q25",sheetRef:"Q25",text:"How well is the solution integrated within the broader GC enterprise ecosystem and aligned with whole-of-government priorities?",weight:1},{id:"BU-Q26",sheetRef:"Q26",text:"Is the solution designed to maximize reuse of existing GC shared services and platforms before building new capabilities?",weight:1},{id:"BU-Q27",sheetRef:"Q27",text:"How transparent is the solution design \u2014 is it documented, accessible, and understandable to those who rely on it?",weight:1}]},{id:"demonstrated-engagement",label:"Demonstrated Engagement",weight:10,questions:[{id:"BU-Q28",sheetRef:"Q28",text:"Have user personas, stories, and journeys been mapped and validated through direct engagement with actual users and stakeholders?",weight:1},{id:"BU-Q29",sheetRef:"Q29",text:"Are there formal, repeatable mechanisms to capture client, user, and stakeholder needs on a continuous basis?",weight:1},{id:"BU-Q30",sheetRef:"Q30",text:"How mature are feedback loops between the delivery team and end users, including Communities of Practice and regular reviews?",weight:1},{id:"BU-Q31",sheetRef:"Q31",text:"Are all roles, accountabilities, and decision rights across the solution ecosystem clearly documented in a RACI or equivalent model?",weight:1},{id:"BU-Q32",sheetRef:"Q32",text:"Is solution documentation, interactive guidance, and self-service assistance available and actively maintained for all user types?",weight:1},{id:"BU-Q33",sheetRef:"Q33",text:"How transparent is the operational status of the solution, including an offering roadmap and historical event schedule?",weight:1},{id:"BU-Q34",sheetRef:"Q34",text:"Are performance metrics (NPS, CSAT, CES, usage rates, drop-off rates) defined, measured, and reported back to stakeholders?",weight:1},{id:"BU-Q35",sheetRef:"Q35",text:"Does the solution support multi-channel delivery patterns (web, chat, phone, in-person) that reflect real user demand?",weight:1},{id:"BU-Q36",sheetRef:"Q36",text:"How mature are personalization, predictive analytics, or AI-assisted capabilities within the solution offering?",weight:1}]},{id:"calculated-measured-and-transparent-performance-and-value",label:"Calculated, Measured & Transparent Performance & Value",weight:10,questions:[{id:"BU-Q37",sheetRef:"Q37",text:"Are Service Level Objectives (SLOs) and Service Level Agreements (SLAs) formally defined, monitored, and reported?",weight:1},{id:"BU-Q38",sheetRef:"Q38",text:"Is there end-to-end instrumentation of delivery processes, enabling real-time performance monitoring and visualization?",weight:1},{id:"BU-Q39",sheetRef:"Q39",text:"How well are costs, prices, and unit economics tracked and published, enabling informed investment decisions?",weight:1},{id:"BU-Q40",sheetRef:"Q40",text:"Are client satisfaction scores (CSAT, NPS, or equivalent) captured systematically and acted upon?",weight:1},{id:"BU-Q41",sheetRef:"Q41",text:"How are quality and error rates measured, tracked, and used to drive continuous improvement?",weight:1},{id:"BU-Q42",sheetRef:"Q42",text:"Are response times, total transaction times, and execution time variance measured and within defined thresholds?",weight:1},{id:"BU-Q43",sheetRef:"Q43",text:"Is trend analysis performed regularly on key metrics to anticipate performance changes and drive proactive action?",weight:1},{id:"BU-Q44",sheetRef:"Q44",text:"Are periodic evaluations of continuing business need performed to assess whether the solution still justifies its cost?",weight:1}]},{id:"operational-readiness",label:"Operational Readiness",weight:10,questions:[{id:"BU-Q45",sheetRef:"Q45",text:"How well-defined is the delivery pipeline, including deployment cadence, automation, rollback procedures, and success rates?",weight:1},{id:"BU-Q46",sheetRef:"Q46",text:"Are skills requirements, staffing levels, and a training and improvement pipeline in place to sustain operations?",weight:1},{id:"BU-Q47",sheetRef:"Q47",text:"Is there an established and confirmed funding strategy, including lifecycle funding beyond the initial build phase?",weight:1},{id:"BU-Q48",sheetRef:"Q48",text:"How mature and tested is the incident management, business continuity, and disaster recovery planning for this solution?",weight:1},{id:"BU-Q49",sheetRef:"Q49",text:"Is the infrastructure and technology acquisition strategy defined, including procurement pathways and lead times?",weight:1},{id:"BU-Q50",sheetRef:"Q50",text:"Has a formal threat and risk assessment (including sovereignty and security classification) been completed and reviewed?",weight:1},{id:"BU-Q51",sheetRef:"Q51",text:"How deep and well-prioritized is the feature and requirements backlog, and does it reflect validated stakeholder needs?",weight:1},{id:"BU-Q52",sheetRef:"Q52",text:"Are there operational runbooks, monitoring dashboards, and on-call processes in place to support production operations?",weight:1}]},{id:"governance-and-strategy",label:"Governance & Strategy",weight:20,questions:[{id:"BU-Q53",sheetRef:"Q53",text:"Is there a clearly defined governance model with accountable decision-makers for the solution's direction and performance?",weight:1},{id:"BU-Q54",sheetRef:"Q54",text:"How well does the solution align with the GC Digital Operations Strategic Plan and departmental enterprise strategy?",weight:1},{id:"BU-Q55",sheetRef:"Q55",text:"Is there a published roadmap with near, medium, and long-term milestones that is communicated to stakeholders?",weight:1},{id:"BU-Q56",sheetRef:"Q56",text:"How mature is the change management process, including impact assessment, approval workflows, and communication plans?",weight:1},{id:"BU-Q57",sheetRef:"Q57",text:"Are compliance requirements (legal, regulatory, policy, accessibility, bilingualism) formally tracked and verified?",weight:1},{id:"BU-Q58",sheetRef:"Q58",text:"Is there a formal risk register maintained for the solution, with assigned owners and documented mitigation strategies?",weight:1},{id:"BU-Q59",sheetRef:"Q59",text:"How well is vendor and third-party relationship governance defined, including performance monitoring and exit strategies?",weight:1},{id:"BU-Q60",sheetRef:"Q60",text:"Is there a documented and approved data governance model aligned with the solution's information and privacy requirements?",weight:1},{id:"BU-Q61",sheetRef:"Q61",text:"How well does the solution contribute to GC-wide shared service consolidation and enterprise architecture objectives?",weight:1}]}]},{id:"data",label:"Data & Information Architecture",weight:25,description:"Turning raw data into trusted, connected insights",sections:[{id:"defining-the-current-state",label:"Defining the Current State",weight:10,questions:[{id:"DA-Q1",sheetRef:"Q1",text:"How well documented are current data models, entity relationships, and data-sharing agreements?",weight:1},{id:"DA-Q2",sheetRef:"Q2",text:"What is the degree of data fragmentation, duplication, and inconsistency across the current solution and its dependencies?",weight:1},{id:"DA-Q3",sheetRef:"Q3",text:"How well understood are data volumes, growth rates, residency requirements, and encryption posture?",weight:1},{id:"DA-Q4",sheetRef:"Q4",text:"Is the lifespan and full data lifecycle \u2014 from creation to disposition \u2014 mapped and governed?",weight:1},{id:"DA-Q5",sheetRef:"Q5",text:"Are data formats proprietary or based on open, interoperable standards?",weight:1},{id:"DA-Q6",sheetRef:"Q6",text:"How open and transparent is data publication, and is a default-open approach applied where appropriate?",weight:1},{id:"DA-Q7",sheetRef:"Q7",text:"Are analytics and trend analysis capabilities available to support decision-making from current data assets?",weight:1},{id:"DA-Q8",sheetRef:"Q8",text:"How mature are data access controls, auditing mechanisms, and the ability to trace who accessed what and when?",weight:1},{id:"DA-Q9",sheetRef:"Q9",text:"How interoperable is the current data environment with other GC systems, programs, and platforms?",weight:1}],stageExpectation:{discovery:"low-ok",alpha:"low-ok"}},{id:"data-architecture-and-standards",label:"Data Architecture & Standards",weight:40,questions:[{id:"DA-Q10",sheetRef:"Q10",text:"Is there a formal, documented data model that reflects all key entities, relationships, attributes, and business rules?",weight:1},{id:"DA-Q11",sheetRef:"Q11",text:"How mature is master data management \u2014 are authoritative data sources identified, maintained, and trusted?",weight:1},{id:"DA-Q12",sheetRef:"Q12",text:"Is data lifecycle governance established, covering creation, versioning, archiving, and secure disposition?",weight:1},{id:"DA-Q13",sheetRef:"Q13",text:"Are international and GC data standards applied (e.g., ISO, DCAT, NIEM, GC Open Data Directive)?",weight:1},{id:"DA-Q14",sheetRef:"Q14",text:"How well defined is data lineage \u2014 can the origin, transformation, and movement of data be traced end-to-end?",weight:1},{id:"DA-Q15",sheetRef:"Q15",text:"Is comprehensive metadata management in place, enabling data discovery, classification, and contextual understanding?",weight:1},{id:"DA-Q16",sheetRef:"Q16",text:"How mature is data quality management \u2014 are completeness, accuracy, consistency, and timeliness measured and enforced?",weight:1},{id:"DA-Q17",sheetRef:"Q17",text:"Is data instrumentation in place to capture operational telemetry, audit records, and system-generated metadata?",weight:1},{id:"DA-Q18",sheetRef:"Q18",text:"Are data read/write performance requirements (volumes, IOPS, movement patterns) understood and architecturally addressed?",weight:1},{id:"DA-Q19",sheetRef:"Q19",text:"Is there a strategy for structured, semi-structured, and unstructured data that applies consistent governance across all types?",weight:1},{id:"DA-Q20",sheetRef:"Q20",text:"How well is data residency managed \u2014 are intentional copies of data tracked, controlled, and compliant with policy?",weight:1},{id:"DA-Q21",sheetRef:"Q21",text:"Does the architecture support event-driven data integration patterns and real-time data processing where needed?",weight:1}]},{id:"privacy-protection-and-compliance",label:"Privacy, Protection & Compliance",weight:25,questions:[{id:"DA-Q22",sheetRef:"Q22",text:"Has a Privacy Impact Assessment (PIA) been completed, and does the architecture reflect its recommendations?",weight:1},{id:"DA-Q23",sheetRef:"Q23",text:"Is Privacy by Design embedded throughout the solution, from data collection through to disposition?",weight:1},{id:"DA-Q24",sheetRef:"Q24",text:"How mature is data categorization \u2014 are all data assets classified by sensitivity, and is handling appropriate to classification?",weight:1},{id:"DA-Q25",sheetRef:"Q25",text:"Is encryption applied at rest, in transit, and in processing for all data at the appropriate sensitivity level?",weight:1},{id:"DA-Q26",sheetRef:"Q26",text:"Are data sovereignty requirements met \u2014 is there full awareness of where data resides, crosses borders, and is subject to foreign law?",weight:1},{id:"DA-Q27",sheetRef:"Q27",text:"Are data retention and disposition policies enforced, including secure deletion
