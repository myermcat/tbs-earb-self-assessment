<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The security story is this line. default-src 'none' means the page cannot load anything from
  anywhere: no script, no stylesheet, no image, no font. Everything it needs is inlined below,
  so it works with the network cable pulled out.

  connect-src is the part that decides whether it can talk to anything. Built with no store it
  is 'none', and the page cannot fetch, XHR or open a socket at all. Built with EARB_ENDPOINT
  set it names that one origin. Built with EARB_FIREBASE set it names the three Google hosts a
  Firestore build needs: sign-in, the token exchange, and the documents. Nothing else is
  reachable in any of the three cases, which is why an SDK loaded from a CDN has no place here.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; form-action 'none'; base-uri 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232a6fbd%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%236c4bb0%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2242%22%20width%3D%228%22%20height%3D%2210%22%20rx%3D%222%22%20fill%3D%22%23fff%22%20opacity%3D%22.45%22%2F%3E%3Crect%20x%3D%2224%22%20y%3D%2234%22%20width%3D%228%22%20height%3D%2218%22%20rx%3D%222%22%20fill%3D%22%23fff%22%20opacity%3D%22.62%22%2F%3E%3Crect%20x%3D%2236%22%20y%3D%2225%22%20width%3D%228%22%20height%3D%2227%22%20rx%3D%222%22%20fill%3D%22%23fff%22%20opacity%3D%22.8%22%2F%3E%3Crect%20x%3D%2248%22%20y%3D%2214%22%20width%3D%228%22%20height%3D%2238%22%20rx%3D%222%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<title>GC Enterprise Architecture self-assessment</title>
<style>/* ==========================================================================================
   GC EA self-assessment
   One stylesheet, inlined into the built file. No web fonts, no CDN - the page has to work
   with the network cable out, so everything here is self-contained.
   ========================================================================================== */

:root {
  /*
   * Ties native widget rendering - buttons, inputs, selects, scrollbars - to the same signal
   * the tokens below use. Without it the controls follow the OS setting while the page follows
   * the media query, and a light page ends up with dark buttons.
   */
  color-scheme: light;

  /* Neutrals */
  --bg:        #f7f8fa;
  --surface:   #ffffff;
  --surface-2: #f1f3f6;
  --line:      #e2e6ec;
  --line-2:    #cdd4dd;
  --ink:       #16191d;
  --ink-2:     #4a5361;
  --ink-3:     #79828f;

  /* Accent */
  --accent:      #2a4b8d;
  --accent-ink:  #ffffff;
  --accent-soft: #eaf0fb;
  --accent-line: #b9caea;

  /* Dan's eleven score colours, as an even ramp */
  --s0:  #1b1d21;  --s1:  #7f1d1d;  --s2:  #c0392b;  --s3:  #d97528;
  --s4:  #d9a520;  --s5:  #c9b528;  --s6:  #8faa23;  --s7:  #3f8f4a;
  --s8:  #1f6b3c;  --s9:  #2a6fbd;  --s10: #6c4bb0;

  /* Semantic */
  --good:      #1f6b3c;
  --good-bg:   #e9f4ed;
  --warn:      #a8620a;
  --warn-bg:   #fdf3e3;
  --bad:       #b3261e;
  --bad-bg:    #fdecea;
  --bad-ink:   #ffffff;          /* text on a filled destructive button */
  --info:      #2a4b8d;

  /* One ground for the frame, a different one for the page between it.
     The frame also gets its own edge. The page hairline measures 1.41:1 against the page,
     which is too faint to read as a boundary; this is the same weight family at 1.48:1. The
     convention is a border first and a shadow only where a border would be missed, which here
     is the moment the page scrolls under the frame. */
  --chrome-bg: #e7ebf1;
  --chrome-line: #c6cfda;

  --radius:    10px;
  --radius-sm: 6px;
  --shadow:    0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 4px 12px rgba(16, 24, 40, .08), 0 1px 3px rgba(16, 24, 40, .06);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg:        #101216;
    --surface:   #191c22;
    --surface-2: #21252d;
    --line:      #2b303a;
    --line-2:    #3a4150;
    --ink:       #e8eaee;
    --ink-2:     #a8b0bd;
    --ink-3:     #7b8492;
    --accent:      #6f96e0;
    --accent-ink:  #101216;
    --accent-soft: #1b2436;
    --accent-line: #2f4570;
    --good: #5fbf82; --good-bg: #14251b;
    --warn: #e0a34a; --warn-bg: #2a2113;
    --bad:  #f08279; --bad-bg:  #2b1614; --bad-ink: #ffffff;
    /* In dark the frame gets LIGHTER than the page, not darker. Going darker left it 1.9
       points of lightness before pure black and separated at 1.08:1. This is 1.19:1, and it
       sits just above the card, so the ladder reads page, card, frame. */
    --chrome-bg: #1e222a;
    --chrome-line: #414957;
    --shadow:    0 1px 2px rgba(0, 0, 0, .4);
    --shadow-lg: 0 6px 18px rgba(0, 0, 0, .45);
  }
}

* { box-sizing: border-box; }

/* Content that exists only on paper: answers, reasoning and evidence that live in form
   controls on screen, and form controls do not print their values. */
.print-only { display: none; }

/* Visible to a screen reader, not on screen. Used to carry "out of 10" beside a score pill. */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* A heading and its score, side by side, with the score outside the heading. */
.head-row { display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; }

html { -webkit-text-size-adjust: 100%; }
/**
 * Wide content scrolls inside its own container; the page itself never does.
 *
 * `clip` and not `hidden`: `overflow-x: hidden` makes body a scroll container, which silently
 * kills `position: sticky` on everything inside it. That is how the header stopped sticking.
 */
html, body { overflow-x: clip; max-width: 100%; }
#app { display: flex; flex-direction: column; min-height: 100dvh; }
.sitefoot { flex: none; }

body {
  margin: 0;
  accent-color: var(--accent);
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.25; letter-spacing: -.011em; font-weight: 650; }
h1 { font-size: 1.55rem; }
h2 { font-size: 1.12rem; }
h3 { font-size: .98rem; }
h4 { font-size: .9rem; }
p  { margin: 0 0 .65rem; }
p:last-child { margin-bottom: 0; }
a  { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
ul { margin: .4rem 0; padding-left: 1.15rem; }
li { margin-bottom: .22rem; }

.muted { color: var(--ink-2); }
.dim   { color: var(--ink-3); }
.small { font-size: .855rem; }
.tiny  { font-size: .78rem; }
.warn-text { color: var(--warn); }
.mono { font-family: var(--mono); font-size: .82rem; }

/* ---------- shell ------------------------------------------------------------------------ */

/* Header and marking banner as one sticky block, so neither can cover the other. */
.chrome { position: sticky; top: 0; z-index: 30; }

.topbar {
  background: var(--chrome-bg);
  display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  padding: .55rem 1.25rem;
  border-bottom: 1px solid var(--chrome-line);
}
/* Lift only once there is content underneath to lift over. At the top of the page the border
   is the whole separation, which is what the border is for. */
/* Watched, so the frame knows whether anything has scrolled under it. It takes no space. */
.top-sentinel { display: block; height: 1px; margin-bottom: -1px; }
.chrome { box-shadow: none; transition: box-shadow .15s ease; }
.scrolled .chrome { box-shadow: 0 10px 18px -12px rgba(16, 24, 40, .55); }
@media (prefers-color-scheme: dark) {
  .scrolled .chrome { box-shadow: 0 12px 22px -12px rgba(0, 0, 0, .85); }
}
@media (prefers-reduced-motion: reduce) { .chrome { transition: none; } }
.brand { display: flex; align-items: center; gap: .55rem; cursor: pointer; min-width: 0; }
.brand-mark {
  width: 26px; height: 26px; flex: 0 0 26px; border-radius: 7px;
  background: linear-gradient(140deg, var(--s9), var(--s10));
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: .72rem;
  letter-spacing: -.03em;
}
.brand strong { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .ver { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }

.topbar-right { display: flex; align-items: center; gap: .8rem;
  /* The assessor header is wider than the submitter one, by the signed-in address and the way
     out, so it wraps at ordinary laptop widths. A lone item on a wrapped space-between line
     falls to the left, which is what reads as the header having floated. An auto margin takes
     the free space on whichever line this group ends up on. */
  margin-left: auto; }
.topbar nav.path { display: flex; align-items: center; gap: .1rem; background: var(--surface-2);
  padding: .18rem .3rem; border-radius: 9px; border: 1px solid var(--line); }
.chev { color: var(--ink-3); font-size: .9rem; padding: 0 .05rem; user-select: none; }

.signin { max-width: 34rem; margin: 2rem auto; }
.signin-providers { flex-direction: column; align-items: stretch; gap: .5rem; }
.signin-providers button { width: 100%; justify-content: center; }

.signin-mock { background: var(--surface-2); border: 1px dashed var(--line-2);
  border-radius: var(--radius-sm); padding: .7rem .85rem; margin-top: .8rem; }
.signin-mock button { margin: .3rem 0 .2rem; }

.side-badge { font-size: .68rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--accent); border: 1px solid var(--accent-line); background: var(--accent-soft);
  border-radius: 999px; padding: .05rem .45rem; }
.crossover { margin: .1rem .3rem .5rem; }

.icon-btn { display: grid; place-items: center; width: 33px; height: 33px; padding: 0;
  border-radius: 9px; color: var(--ink-2); border: 1px solid var(--line); background: var(--surface); }
.icon-btn:hover { color: var(--ink); }
.icon-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tab {
  border: 0; background: transparent; color: var(--ink-2);
  padding: .34rem .8rem; border-radius: 7px; font-size: .875rem; font-weight: 550; cursor: pointer;
  transition: background .12s, color .12s;
}
.tab:hover { color: var(--ink); }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.body { max-width: min(940px, 100%); margin: 1.15rem auto 6rem; padding: 0 1.15rem; flex: 1 0 auto; }
.body-submit { padding-bottom: 9rem; }
.sitefoot { text-align: center; color: var(--ink-3); font-size: .78rem; padding: .8rem 1rem 2.5rem;
  background: var(--surface-2); border-top: 1px solid var(--line); }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.05rem 1.15rem; margin-bottom: .85rem; box-shadow: var(--shadow);
}
.card.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--warn-bg); }
.card.tight { padding: .6rem .8rem; }

/* ---------- controls -------------------------------------------------------------------- */

button, .filelabel {
  font: inherit; font-size: .885rem; font-weight: 550; cursor: pointer;
  border-radius: 8px; padding: .44rem .9rem; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink);
  transition: background .12s, border-color .12s, box-shadow .12s;
}
button:hover:not(:disabled), .filelabel:hover { border-color: var(--accent-line); background: var(--accent-soft); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
button.ghost { background: var(--surface); }
button.small, .filelabel.small { padding: .2rem .55rem; font-size: .8rem; border-radius: 6px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
summary:focus-visible, .filelabel:focus-within {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.filelabel { display: inline-block; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

.field { display: block; margin-bottom: .75rem; }
.field > span { display: block; font-size: .82rem; font-weight: 550; color: var(--ink-2); margin-bottom: .25rem; }
input[type=text], input[type=number], textarea, select {
  font: inherit; font-size: .9rem; width: 100%; padding: .45rem .6rem;
  border: 1px solid var(--line-2); border-radius: 8px;
  background: var(--surface); color: var(--ink);
}
input::placeholder, textarea::placeholder { color: var(--ink-3); }
input[type=number] { width: 4.4rem; }
textarea { resize: vertical; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0 1rem; }

/* ---------- stepper --------------------------------------------------------------------- */

.stepper { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: .45rem; margin-bottom: .9rem; }
.step {
  display: flex; flex-direction: column; align-items: stretch; gap: .3rem;
  padding: .5rem .7rem; border-radius: var(--radius); text-align: left;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.step.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.step.complete { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.step-label { font-size: .885rem; font-weight: 600; }
.step-count { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }
.step-bar { height: 3px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.step-bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px;
  transition: width .2s ease; }
.step.complete .step-bar i { background: var(--good); }

/* ---------- home ------------------------------------------------------------------------ */

/**
 * The start page is meant to be one screen with nothing below the fold, so the shell becomes
 * a fixed-height column and the content centres inside it. A short or narrow viewport cannot
 * hold it, so scrolling comes back there.
 */
/**
 * One screen when it fits, and a scroll when it does not. `height` plus `overflow: hidden`
 * clipped the hero on shorter windows, cutting the primary button in half, which is worse
 * than a scrollbar by any measure.
 */
.app-home { min-height: 100dvh; display: flex; flex-direction: column; }
.app-home .body { flex: 1 1 auto; display: flex; flex-direction: column;
  justify-content: center; margin: 0 auto; padding: 1.2rem 1.15rem; }
.app-home .sitefoot { flex: 0 0 auto; padding: .5rem 1rem 1rem; }

@media (max-width: 760px) {
  .app-home .body { justify-content: flex-start; padding: 1rem 1.15rem 3rem; }
}

.body-home { max-width: 900px; }

.hero {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 2rem 2.2rem; margin: 0 0 .85rem; box-shadow: var(--shadow-lg);
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0 auto 0 0; width: 4px;
  background: linear-gradient(180deg, var(--s2), var(--s5), var(--s7), var(--s9), var(--s10));
}
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: .5rem; }
.hero h1 { font-size: 2.6rem; letter-spacing: -.028em; margin-bottom: .55rem; }
.hero .lead { font-size: 1.1rem; line-height: 1.45; color: var(--ink-2); max-width: 46ch;
  margin-bottom: 1.15rem; }
.hero-actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: baseline; }
button.big { font-size: .98rem; padding: .62rem 1.4rem; border-radius: 9px;
  display: inline-flex; align-items: center; gap: .5rem; }
button.big .arrow { font-size: 1.05rem; transition: transform .15s ease; }
button.big:hover .arrow { transform: translateX(3px); }
.or { color: var(--ink-3); font-size: .88rem; }
.draft-note { margin-top: .85rem; padding-top: .65rem; border-top: 1px solid var(--line); }
.draft-note p { margin-bottom: .25rem; }
.draft-note .tiny .linkish { color: var(--ink-3); text-decoration-color: var(--line-2); }
.draft-note .tiny .linkish:hover { color: var(--accent); }
.filelabel-plain { background: none; border: 0; padding: 0; font-size: .88rem; cursor: pointer; }

/* The maturity ladder from the favicon, at rest. Decorative only. */
.hero-art { display: flex; align-items: flex-end; gap: .45rem; height: 128px; }
.hero-art .rung { width: 17px; border-radius: 5px; display: block; }
.hero-art .r1 { height: 26%;  background: var(--s2); opacity: .55; }
.hero-art .r2 { height: 44%;  background: var(--s4); opacity: .65; }
.hero-art .r3 { height: 62%;  background: var(--s6); opacity: .75; }
.hero-art .r4 { height: 82%;  background: var(--s8); opacity: .85; }
.hero-art .r5 { height: 100%; background: var(--s10); }

/* Three short notes side by side. Stacked, they cost three times the height for the same
   words, on a page whose whole point is fitting one screen. */
.note { background: transparent; border: 0; padding: 0 .3rem; margin-top: 1.5rem; }
.note h2 { font-size: .66rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); opacity: .75; margin-bottom: .8rem; }
.note ul { list-style: none; padding: 0; margin: 0;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: .35rem 1.4rem; }
.note li { font-size: .77rem; line-height: 1.45; color: var(--ink-3); opacity: .85;
  padding-left: .75rem; position: relative; border-left: 1px solid var(--line); }
.note li::before { content: none; }
.note li b { display: block; color: var(--ink-2); font-weight: 600; margin-bottom: .12rem; }



button.linkish { background: none; border: 0; padding: 0; color: var(--accent);
  font-size: inherit; font-weight: inherit; text-decoration: underline;
  text-underline-offset: 2px; }
button.linkish:hover { background: none; border: 0; filter: brightness(1.15); }

dl.kv { display: grid; grid-template-columns: auto 1fr; gap: .2rem .9rem; margin: 0 0 .7rem;
  font-size: .89rem; }
dl.kv dt { color: var(--ink-3); font-weight: 600; }
dl.kv dd { margin: 0; }

@media (max-width: 700px) {
  .hero { grid-template-columns: 1fr; padding: 1.6rem 1.3rem; gap: 1.2rem; }
  .hero h1 { font-size: 1.75rem; }
  .hero-art { height: 76px; }
}

/* Short windows: the same page, tighter, so it still fits without scrolling. Below this it
   scrolls, which is honest, but a laptop with a bookmarks bar should not have to. */
@media (max-height: 720px) {
  .app-home .body { padding: .6rem 1.15rem; }
  .hero { padding: 1.5rem 1.9rem; gap: 1.5rem; margin-bottom: .6rem; }
  .hero h1 { font-size: 2.1rem; margin-bottom: .4rem; }
  .hero .lead { font-size: 1rem; margin-bottom: .9rem; }
  .hero-art { height: 96px; }
  .hero-art .rung { width: 14px; }
  button.big { font-size: .95rem; padding: .55rem 1.25rem; }
  .eyebrow { margin-bottom: .3rem; }
  .note { margin-top: 1.1rem; }
  .note li { font-size: .75rem; line-height: 1.4; }
  .crossover { margin: 0 .3rem .35rem; }
  .app-home .sitefoot { padding: .35rem 1rem .6rem; }
}

/* Shorter still: the artwork is decorative, so it is the first thing to go. */
@media (max-height: 620px) {
  .hero { padding: 1.2rem 1.6rem; grid-template-columns: 1fr; }
  .hero-art { display: none; }
  .hero h1 { font-size: 1.85rem; }
  .hero .lead { font-size: .95rem; margin-bottom: .75rem; max-width: 62ch; }
  .note { margin-top: .9rem; }
  .note h2 { margin-bottom: .45rem; }
  .note li { font-size: .73rem; }
}


code.mono { background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 4px; padding: .02rem .3rem; }

/* ---------- lifecycle stage picker ------------------------------------------------------ */

.stage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: .45rem; }
.stage-card {
  display: flex; gap: .55rem; align-items: flex-start; cursor: pointer;
  border: 1px solid var(--line); border-radius: var(--radius); padding: .6rem .7rem;
  background: var(--surface); transition: border-color .12s, box-shadow .12s;
}
.stage-card:hover { border-color: var(--accent-line); }
.stage-card:has(input:checked) { border-color: var(--accent); background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent); }
.stage-card input { width: auto; margin-top: .25rem; flex: 0 0 auto; }
.stage-card strong { font-size: .9rem; }
.dlg-link { display: inline-block; font-size: .78rem; margin-top: .25rem; }

/* ---------- the questionnaire: rail beside the sheet ------------------------------------ */

.body-submit { max-width: 1200px; }
.form-layout { display: grid; grid-template-columns: 14.5rem minmax(0, 1fr); gap: 1.1rem;
  align-items: start; }
.sheet { min-width: 0; }

/* The domain tabs live inside the sticky chrome, so the level she compared to Excel sheet
   tabs is on screen for the whole scroll rather than the first screenful. Compact, because
   they are paying for that out of the vertical budget. */
/* One row, always. A wrapping grid took 270px of an 900px viewport at a narrow width, which
   is a quarter of the screen spent on knowing where you are. */
.chrome .stepper { display: flex; gap: .3rem; overflow-x: auto; scrollbar-width: none;
  background: var(--chrome-bg); border-bottom: 1px solid var(--chrome-line);
  padding: .35rem 1.15rem; margin: 0; }
.chrome .stepper::-webkit-scrollbar { display: none; }
.chrome .step { flex: 0 0 auto; min-width: 0; padding: .22rem .6rem .28rem; gap: .1rem;
  box-shadow: none; background: var(--surface-2); }
.chrome .step-label { font-size: .8rem; white-space: nowrap; }
.chrome .step-count { font-size: .68rem; }
.chrome .step-bar { height: 2px; }

.rail { position: sticky; top: calc(var(--chrome-h, 3.2rem) + .6rem); }
.toc { display: flex; flex-direction: column; gap: .1rem; }
.toc-row { display: grid; grid-template-columns: 1fr auto; gap: .3rem .5rem; align-items: baseline;
  width: 100%; text-align: left; background: none; border: 0; border-radius: 7px;
  padding: .3rem .5rem; font-size: .82rem; color: var(--ink-2); }
.toc-row:hover { background: var(--surface-2); border: 0; }
.toc-label { overflow: hidden; text-overflow: ellipsis; }
.toc-count { font-family: var(--mono); font-size: .7rem; color: var(--ink-3); }
.toc-dom { font-weight: 650; color: var(--ink); font-size: .86rem; margin-top: .35rem; }
.toc-dom.open { color: var(--accent); }
.toc-sec { padding-left: .9rem; }
.toc-sec .toc-bar, .toc-overview .toc-bar { grid-column: 1 / -1; height: 2px; border-radius: 999px;
  background: var(--surface-2); overflow: hidden; }
.toc-sec .toc-bar i, .toc-overview .toc-bar i { display: block; height: 100%;
  background: var(--accent); transition: width .3s ease; }
.toc-row.on { background: var(--accent-soft); color: var(--ink); font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent); }
.toc-row.done .toc-count { color: var(--good); }
.toc-row.done .toc-bar i { background: var(--good); }

.section-head-card .eyebrow { margin-bottom: .3rem; }

/* Moving on is a pair of buttons, not a card with a button rattling around in it. */
.pager { justify-content: space-between; gap: .5rem;
  border-top: 1px solid var(--line); padding-top: .9rem; margin-top: .3rem; }
.pager button { max-width: 22rem; }

@media (max-width: 860px) {
  .form-layout { grid-template-columns: 1fr; }
  .rail { position: static; }
  .toc { flex-direction: row; overflow-x: auto; gap: .3rem; padding-bottom: .3rem; }
  .toc-domain { display: contents; }
  .toc-sec .toc-bar { display: none; }
  .toc-row { white-space: nowrap; }
  /* Nothing here the domain tabs above do not already show. */
  .toc.no-sections { display: none; }
  .toc .toc-overview { display: none; }
}

/* The overview asks for several unrelated things, so they are visibly separate. */
hr.q-split { border: 0; border-top: 1px solid var(--line); margin: 1.2rem 0 .9rem; }

/* One question at a time while anything is missing. */
.ov-wizard { min-height: 21rem; display: flex; flex-direction: column; }
.ov-progress { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  padding-bottom: .7rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; }
.ov-progress .linkish { margin-left: auto; }
/* The gap has to clear the halo on the current dot, or the ring reaches into its neighbour.
   Halo is 3px each side, so the gap is 9px. */
.ov-dots { display: flex; gap: .55rem; align-items: center; }
.ov-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--line-2);
  flex: 0 0 auto; }
.ov-dot.filled { background: var(--good); }
.ov-dot.on { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ov-dot.filled.on { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
.ov-block { flex: 1 1 auto; }
.ov-block h2 { font-size: 1.2rem; margin-bottom: .35rem; }
.ov-block h3 { margin-bottom: .3rem; }
.ov-block input[type=text], .ov-block textarea { font-size: 1rem; padding: .55rem .7rem; }
.ov-nav { justify-content: space-between; margin-top: 1.1rem; }

/* Create, Live and Sunset are three different situations, and looked like one long list. */
.phase-groups { display: grid; gap: .8rem; }
.phase-group { border-left: 3px solid var(--line-2); padding-left: .75rem; }
.phase-group.phase-create  { border-color: var(--s3); }
.phase-group.phase-live    { border-color: var(--s7); }
.phase-group.phase-sunset  { border-color: var(--s9); }
.phase-head { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .35rem; flex-wrap: wrap; }
.phase-head h4 { font-size: .9rem; }
a.faint-link { color: var(--ink-3); text-decoration-color: var(--line-2); }
a.faint-link:hover { color: var(--accent); }

/* ---------- results, one screen at a time ------------------------------------------------ */

/**
 * The results read as a report, and the scroll rests near the start of each part.
 *
 * It used to insist. Mandatory snapping with a stop on every section dragged each short scroll
 * back to the nearest edge, made a part taller than the window hard to read, and forbade
 * passing more than one part per gesture. Proximity suggests where a part begins and leaves the
 * gesture alone, and the dots on the right are still the way to jump between them.
 *
 * The body becomes its own scroll container, so the header stays put without being sticky.
 */
/* Sign in is exactly one viewport, and the card centres in it. The body is the scroll
   container, never html or body, because that would break the pinned header. */
.app-signin { height: 100dvh; overflow: hidden; }
.app-signin .body { flex: 1 1 auto; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; justify-content: center;
  margin: 0 auto; padding: 1rem 1.15rem; }
.app-signin .signin { flex: 0 0 auto; width: 100%; margin: 0 auto; }
/* The screen an account without access meets. It borrows the sign-in shell, because it is the
   same kind of moment: one screen, nothing to scroll, and a way onward. */
.app-signin .no-access { flex: 0 0 auto; width: 100%; max-width: 44rem; margin: 0 auto; }
.no-access h1 { margin: 0 0 .4rem; font-size: 1.35rem; }
.no-access .addr { display: inline-block; margin: 0 0 .8rem; padding: .18rem .45rem;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: .35rem; }
.card.no-access > .actions { margin-top: .2rem; }
.app-signin .sitefoot { padding: .5rem 1rem 1rem; }

/* One card on an otherwise empty screen centres, instead of hanging off the top edge with the
   footer stranded under it. The class comes off as soon as a file loads. */
.body-empty { flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column; justify-content: center;
  margin: 0 auto; padding: 1rem 1.15rem; }
.body-empty > .card { width: 100%; margin-bottom: 0; }

/**
 * The results read as a report, so the page scrolls like one.
 *
 * This used to be its own scroll container: #app was exactly the height of the window with
 * overflow hidden, and the reading column inside it was capped at 940px and centred. Three
 * faults came out of that, and together they are why the scroll barely worked. The wheel did
 * nothing over the side margins, which at 1440px was 500 pixels of the window and at 1920px
 * more than half of it. The keyboard could not scroll at all, because the container never took
 * focus and the document behind it had nothing to scroll. And the header and the footer were
 * subtracted from the reading area on every screen rather than scrolling away, which cost a
 * third of a phone.
 *
 * So the document scrolls, the way every other screen in the tool already does. The dots on
 * the right still take you to a part.
 */
.body-results { padding-bottom: 3rem; }
/**
 * The ratio that does the work.
 *
 * The gap between blocks used to equal the padding inside them: cards pad 1.05rem and the
 * stack gapped 1.15rem. So the distance from a heading to its own content matched the distance
 * to the next topic's heading, and proximity, which is the strongest grouping signal there is,
 * said nothing. Ten blocks with one fill, one border and one width then read as one striped
 * surface. Inside a block is .5rem to .85rem, between two parts of a region 1.9rem, and
 * between two regions 2.9rem and a rule.
 */
.body-results > section { scroll-margin-top: 5rem; margin: 0; }
.body-results > section + section { margin-top: 2.9rem; }

/* ---------- results: one verdict, four regions -------------------------------------------
 * A region is not a card. It is a heading on the page ground with a rule over it. The rule
 * uses --line-2 because the note at the top of this file measured --line at 1.41:1 against the
 * page and found it too faint to read as a boundary. Parts inside a region keep --line, so the
 * two weights read as region, then part.
 *
 * Only two things on this page get a box: the number, and anything that blocks you.
 * ------------------------------------------------------------------------------------------ */
.res-region { border-top: 1px solid var(--line-2); padding-top: .95rem; }
.res-region > h2 { font-size: 1.28rem; letter-spacing: -.015em; }
.res-region > h2 + p { margin-top: .35rem; color: var(--ink-2); max-width: 66ch; }
.res-region > * + * { margin-top: .85rem; }
.res-region > h2 + .res-sub, .res-region > p + .res-sub { margin-top: 1.15rem; }
.res-region > .res-sub + .res-sub { margin-top: 1.9rem; }

.res-sub > h3 { font-size: 1.02rem; font-weight: 650; margin: 0 0 .45rem; }
.res-sub > h3 + p.muted { margin-top: -.15rem; max-width: 66ch; }
.res-sub > * + * { margin-top: .5rem; }
.res-sub > details > summary { cursor: pointer; font-weight: 550; color: var(--accent);
  padding: .3rem 0; }

/* Three fills stop reading the moment the card ground goes away, and all three still look
   fine in dark mode, which is how this gets missed. */
.res-region .flag { background: var(--surface); border: 1px solid var(--line);
  border-left-width: 3px; }
.res-region .bar-track { box-shadow: inset 0 0 0 1px var(--line-2); }
.res-sub .table-wrap { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); }

/* The one elevated thing on the page. In light mode --surface against --bg is a small step,
   too small to carry dominance alone, so the border goes up a weight, the shadow goes up a
   step, and the score's own ramp colour draws the top edge. In dark the fill step is already
   large and the edge only confirms it. */
.card.verdict { position: relative; overflow: hidden; padding: 1.25rem 1.35rem;
  border-color: var(--line-2); box-shadow: var(--shadow-lg); }
.verdict-edge { position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--accent); }
.card.verdict h1 { font-size: 1.3rem; }
.card.verdict .bigscore .num { font-size: 3.4rem; letter-spacing: -.03em; }

/* The rail is an index, and every dot carries the name of the part it goes to. */
.snap-hint { position: fixed; right: 1rem; top: 50%; transform: translateY(-50%); z-index: 20;
  display: flex; flex-direction: column; gap: .45rem; align-items: flex-end; }
.snap-dot { display: flex; align-items: center; gap: .5rem; width: auto; height: auto;
  padding: .1rem 0; background: none; border: 0; color: var(--ink-3); cursor: pointer; }
.snap-dot:hover { background: none; border: 0; }
.snap-dot::after { content: ''; width: 8px; height: 8px; border-radius: 999px;
  background: var(--line-2); transition: background .15s, transform .15s; }
.snap-name { font-size: .72rem; white-space: nowrap; opacity: 0; transition: opacity .15s; }
.snap-dot:hover .snap-name, .snap-dot:focus-visible .snap-name,
.snap-dot.on .snap-name { opacity: 1; }
.snap-dot:hover::after { background: var(--ink-3); }
.snap-dot.on { color: var(--ink); }
.snap-dot.on::after { background: var(--accent); transform: scale(1.4); }
@media (prefers-reduced-motion: reduce) { .snap-dot, .snap-name { transition: none; } }

/* On a phone the rail lies down into a strip, because the viewport is shorter than the space
   between two regions and a reader never sees two of them at once. */
@media (max-width: 700px) {
  .snap-hint { position: fixed; inset: auto 0 0 0; top: auto; transform: none;
    flex-direction: row; justify-content: flex-start; gap: .25rem; flex-wrap: nowrap;
    overflow-x: auto; scrollbar-width: none; background: var(--chrome-bg);
    border-top: 1px solid var(--chrome-line); padding: .35rem .5rem; }
  .snap-hint::-webkit-scrollbar { display: none; }
  .snap-dot { flex: 0 0 auto; flex-direction: row-reverse; gap: .3rem;
    padding: .22rem .55rem; border-radius: 7px; }
  .snap-name { opacity: 1; font-size: .7rem; }
  .snap-dot.on { background: var(--accent-soft); }
  .body-results { padding-bottom: 4.5rem; }
  .body-results > section + section { margin-top: 2rem; }
  .res-region > .res-sub + .res-sub { margin-top: 1.4rem; }
}


@media (max-height: 620px) {
  .app-signin { height: auto; overflow: visible; }
  .app-signin .body { overflow: visible; justify-content: flex-start; }
  .snap-hint { display: none; }
}

/* ---------- settings: a rail and one pane ------------------------------------------------
 *
 * Three stacked cards on a tinted ground made the page busy: the eye parses four rectangles
 * before it reaches a sentence. One category at a time, on flat rows divided by hairlines,
 * which is what the assessor's audit rows already do here.
 * ------------------------------------------------------------------------------------------ */

.body-settings { max-width: 1040px; }
.set-layout { display: grid; grid-template-columns: 13.5rem minmax(0, 1fr); gap: 1.6rem;
  align-items: start; }

.set-nav { position: sticky; top: calc(var(--chrome-h, 3.2rem) + 1rem);
  display: flex; flex-direction: column; gap: .1rem; }
.set-navgroup { font-size: .66rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); padding: .5rem .55rem .25rem; }
.set-navrow { width: 100%; text-align: left; background: none; border: 0; border-radius: 7px;
  padding: .34rem .55rem; font-size: .875rem; font-weight: 550; color: var(--ink-2); }
.set-navrow:hover { background: var(--surface-2); border: 0; }
.set-navrow.on { background: var(--accent-soft); color: var(--ink); font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent); }
.set-navsep { height: 1px; background: var(--line); margin: .5rem .55rem; }

/* The rail carries the escalation too, so it is visible before anything is clicked. */
.set-navrow.danger { color: color-mix(in srgb, var(--bad) 80%, var(--ink-3)); }
.set-navrow.danger:hover { background: var(--bad-bg); }
.set-navrow.danger.on { background: var(--bad-bg); color: var(--bad);
  box-shadow: inset 2px 0 0 var(--bad); }

.set-pane { min-width: 0; }
.set-pane > h1 { font-size: 1.35rem; margin-bottom: .15rem; }
.set-pane > h1:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.set-lead { color: var(--ink-2); margin-bottom: 1.1rem; }
.set-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .3rem 1.2rem;
  align-items: center; padding: .85rem 0; border-top: 1px solid var(--line); }
.set-row:first-of-type { border-top: 0; }
.set-row-title { font-weight: 600; font-size: .95rem; display: flex; gap: .45rem;
  align-items: baseline; flex-wrap: wrap; }
.set-row p { font-size: .855rem; color: var(--ink-2); margin: .15rem 0 0; max-width: 58ch; }
.set-row-act { justify-self: end; }

/* Danger, in four steps. Colour is never the only cue: the badge, the label, the enclosure
   and the position all move with it. */
.set-row.caution { border-left: 3px solid var(--warn); background: var(--warn-bg);
  padding-left: .75rem; padding-right: .75rem;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.set-row.danger { border-left: 3px solid var(--bad); background: var(--bad-bg);
  padding-left: .75rem; padding-right: .75rem;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }

.badge-bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent);
  background: var(--bad-bg); }

button.caution { color: var(--warn); background: var(--surface);
  border-color: color-mix(in srgb, var(--warn) 55%, var(--line-2)); }
button.caution:hover:not(:disabled) { background: var(--warn-bg); border-color: var(--warn); }
button.danger { color: var(--bad); background: var(--surface);
  border-color: color-mix(in srgb, var(--bad) 55%, var(--line-2)); }
button.danger:hover:not(:disabled) { background: var(--bad-bg); border-color: var(--bad); }
button.danger-solid { background: var(--s1); color: var(--bad-ink);
  border-color: color-mix(in srgb, var(--bad) 60%, var(--s1)); }
button.danger-solid:hover:not(:disabled) { background: var(--s1); filter: brightness(1.2); }

.undo-bar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
  border-left: 3px solid var(--good); background: var(--good-bg); padding: .55rem .7rem;
  margin-bottom: 1.1rem; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }

/* The confirmation. Native <dialog> gives the focus trap, Escape and focus restoration. */
dialog.confirm { border: 0; padding: 0; border-radius: 14px; max-width: 32rem;
  width: calc(100% - 2rem); background: var(--surface); color: var(--ink);
  box-shadow: var(--shadow-lg); }
dialog.confirm::backdrop { background: rgba(10, 12, 16, .55); }
/* The typed delete. The button stays dead until the name matches, and looks it. */
.typed-list { margin: .2rem 0 .7rem; padding-left: 1.1rem; font-size: .88rem; color: var(--ink-2); }
.typed-list li { margin-bottom: .2rem; }
.typed-ask { margin: .9rem 0 .45rem; font-size: .88rem; }
.typed-ask code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px;
  padding: .05rem .3rem; }
.typed-field { width: 100%; margin-bottom: .2rem; }
/* A menu inside a table row sits above the rows below it. */
.row-menu .set-menu-pop { right: 0; min-width: 13rem; }
/* The account button. Two letters where a product with avatars would put a face. */
.account-menu { position: relative; }
.account-btn { display: inline-flex; align-items: center; justify-content: center;
  width: 33px; height: 33px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink-2); font-size: .68rem; font-weight: 700;
  letter-spacing: .04em; cursor: pointer; }
.account-btn:hover { border-color: var(--accent-line); color: var(--accent); }
.account-menu .set-menu-pop { right: 0; min-width: 15rem; }
.menu-head { display: block; padding: .1rem .55rem; font-size: .72rem; color: var(--ink-3); }
.menu-head.mono { color: var(--ink-2); padding-bottom: .35rem; }
.menu-item { display: flex; align-items: center; gap: .55rem; }
.menu-ico { display: inline-flex; flex: none; color: var(--ink-3); }
.menu-item:hover .menu-ico { color: var(--accent); }

/* File, beside the name of the tool, the way a document editor keeps it. */
/* The button was clipped: .brand crops what runs past it, and a menu on the end of the brand
   row was the thing running past it. It gets its own place in the bar instead. */
.file-menu { position: relative; flex: 0 0 auto; }
/* .set-menu-btn is a 1.8rem square, built for a three-dot button. A word does not fit in it,
   which is what the clipping was. */
.file-menu > .file-btn { width: auto; height: auto; display: inline-flex; align-items: center;
  border: 0; background: none; color: var(--ink-2); font-size: .8rem;
  padding: .28rem .5rem; border-radius: 7px; cursor: pointer; white-space: nowrap;
  list-style: none; }
.file-menu > .file-btn:hover { background: var(--surface-2); color: var(--accent); }
.file-menu .set-menu-pop { left: 0; right: auto; min-width: 15rem; }
/* Share reads as a control over access, which is what the icon is for. */
.share-btn { display: inline-flex; align-items: center; gap: .35rem; }
.share-ico { display: inline-flex; }
dialog.confirm .danger-solid[disabled] { opacity: .45; cursor: not-allowed; }
dialog.confirm .danger-solid.armed { box-shadow: 0 0 0 2px color-mix(in srgb, var(--bad) 35%, transparent); }

dialog.confirm.no-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  margin: 0; z-index: 70; box-shadow: var(--shadow-lg); }
/* Deleting without taking a copy is allowed, and it is the strongest-looking button here. */
dialog.confirm.tier-danger .danger-solid, dialog.confirm.tier-danger .danger {
  background: var(--bad); border-color: var(--bad); color: var(--bad-ink); font-weight: 700; }
dialog.confirm.tier-danger .danger-solid:hover, dialog.confirm.tier-danger .danger:hover {
  background: color-mix(in srgb, var(--bad) 85%, black); border-color: color-mix(in srgb, var(--bad) 85%, black); }
@media (prefers-color-scheme: dark) { dialog.confirm::backdrop { background: rgba(0, 0, 0, .7); } }
.cf-head { padding: 1rem 1.15rem .35rem; border-top: 3px solid var(--bad);
  border-radius: 14px 14px 0 0; }
.tier-caution .cf-head { border-top-color: var(--warn); }
/* Nothing is being taken away, so nothing here is red. */
.tier-plain .cf-head { border-top-color: var(--accent); }
.cf-note { display: block; margin: .7rem 0 0; padding: .1rem 0 .1rem .7rem;
  border-left: 2px solid var(--line-2); color: var(--ink-3); font-size: .84rem; }
.tier-plain .cf-stake { border-left-color: var(--line-2); background: var(--surface-2);
  color: var(--ink-2); }
.cf-title { font-size: 1.1rem; }
.cf-body { padding: .35rem 1.15rem 0; font-size: .9rem; color: var(--ink-2); }
.cf-stake { display: block; border-left: 3px solid var(--bad); background: var(--bad-bg);
  color: var(--ink); padding: .5rem .7rem; margin: .7rem 0 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: .875rem; }
.cf-stake.ok { border-color: var(--good); background: var(--good-bg); }
.cf-actions { display: grid; gap: .45rem; padding: .9rem 1.15rem 1.15rem; }
.cf-wide { width: 100%; text-align: center; }

@media (max-width: 700px) {
  .set-layout { grid-template-columns: 1fr; gap: .9rem; }
  .set-nav { position: static; flex-direction: row; overflow-x: auto; gap: .3rem;
    padding-bottom: .35rem; scrollbar-width: none; }
  .set-nav::-webkit-scrollbar { display: none; }
  .set-navrow { white-space: nowrap; width: auto; }
  .set-navgroup, .set-navsep { display: none; }
  .set-row { grid-template-columns: 1fr; align-items: start; }
  .set-row-act { justify-self: start; }
}

/* ---------- questions ------------------------------------------------------------------- */

.card.section { padding: .35rem .75rem; }
.section-summary {
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  padding: .55rem .1rem; cursor: pointer; list-style: none;
}
.section-summary::-webkit-details-marker { display: none; }
.section-summary::before {
  content: ''; width: 0; height: 0; flex: 0 0 auto;
  border-left: 5px solid var(--ink-3); border-top: 4px solid transparent; border-bottom: 4px solid transparent;
  transition: transform .15s; transform-origin: 25% 50%;
}
details[open] > .section-summary::before { transform: rotate(90deg); }
.section-title { font-weight: 650; flex: 1 1 13rem; font-size: .95rem; }

.question {
  position: relative;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .85rem 1rem .7rem 1.15rem; margin-bottom: .6rem; box-shadow: var(--shadow);
  break-inside: avoid;
}
/* A status edge in the score's own colour, so a page of questions shows its shape at a glance. */
.question::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  border-radius: var(--radius) 0 0 var(--radius);
  background: var(--edge, var(--line-2));
}
.question.answered::before { background: var(--edge, var(--accent)); }
.question.unanswered::before { background: repeating-linear-gradient(
  180deg, var(--line-2) 0 4px, transparent 4px 8px); }
.question.na .q-ans { opacity: .55; }
.question.na .q-extras-summary { color: var(--ink-2); }
/* The scale explains a score, and a question that does not apply has none. */
.question.na .ladder-box { display: none; }
.question.na::before { background: var(--line-2); }
.q-head { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .2rem; }
.qid { font-family: var(--mono); font-size: .7rem; color: var(--ink-3);
  border: 1px solid var(--line); border-radius: 4px; padding: .05rem .3rem; flex: 0 0 auto; }
.q-text { font-weight: 550; flex: 1 1 20rem; }

.badge { font-size: .72rem; font-weight: 600; padding: .08rem .42rem; border-radius: 999px;
  border: 1px solid; white-space: nowrap;
  /* A tag reads as part of the word before it when nothing separates them. Every badge in the
     app carries its own left margin, because the alternative is remembering to add one at
     forty call sites and forgetting at six. */
  margin-left: .4rem; }
/* Where a badge starts a line or a flex row that already has a gap, the margin is noise. */
.head-row .badge, .actions .badge, .res-toolbar .badge, .pool-in .badge, .share-row .badge,
.flag-title .badge, .code-shown .badge, .crossover .badge:first-child { margin-left: 0; }
.badge-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-bg); }
.badge-soft { color: var(--ink-3); border-color: var(--line); background: var(--surface-2); }

.ladder-box { margin: .25rem 0 .5rem; font-size: .84rem; }
.ladder-box summary { cursor: pointer; color: var(--accent); font-weight: 550; }
.ladder { margin: .5rem 0 .3rem; padding: .5rem .7rem; list-style: none;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); }
.ladder li { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: .1rem .6rem;
  align-items: baseline; padding: .18rem 0; }
.ladder li + li { border-top: 1px solid var(--line); }
.ladder b { font-family: var(--mono); text-align: right; color: var(--ink-3); }
.ladder i { font-style: normal; font-weight: 650; color: var(--ink); }
.ladder span { color: var(--ink-2); line-height: 1.4; }

/* A yes/no question. A no is a red flag: the section is marked and the person carries on. */
.yn-btn { padding: .3rem 1.1rem; border-radius: 7px; font-size: .88rem; font-weight: 600;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); }
.yn-btn.on.yes { background: var(--good); border-color: var(--good); color: #fff; }
.yn-btn.on.no { background: var(--bad); border-color: var(--bad); color: #fff; }
.yn-btn:disabled { opacity: .3; }

/* The flag, in the three places a section appears: the page, the rail, the domain tab. */
.question.red-flag { box-shadow: var(--shadow), inset 0 0 0 1px color-mix(in srgb, var(--bad) 45%, transparent); }
.question.red-flag::before { background: var(--bad); }
.section-head-card.red-flag { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.flag-note { border-left: 3px solid var(--bad); background: var(--bad-bg); color: var(--ink);
  padding: .45rem .7rem; margin-top: .6rem; font-size: .855rem;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.toc-row.red-flag { color: var(--bad); }
.toc-row.red-flag .toc-count { color: var(--bad); }
.toc-row.red-flag .toc-bar i { background: var(--bad); }
.toc-row.red-flag.on { background: var(--bad-bg); box-shadow: inset 2px 0 0 var(--bad); }
.step.red-flag { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.step.red-flag .step-label::after { content: ' !'; color: var(--bad); font-weight: 800; }
.step.red-flag .step-bar i { background: var(--bad); }
/* A portfolio row where somebody answered no. A border on a <tr> does not paint, so the tint
   goes on the cells. */
tr.red-flag td { background: var(--bad-bg); }
tr.red-flag td:first-child { box-shadow: inset 2px 0 0 var(--bad); }

/* the 0-10 selector, in Dan's colours */
.score-line { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .5rem 0 .35rem; }
.score-row { display: flex; gap: .2rem; flex-wrap: wrap; align-items: center; }
.score-btn[aria-disabled='true'] { opacity: .3; }
.score-btn {
  width: 2.05rem; padding: .3rem 0; text-align: center; border-radius: 7px;
  font-family: var(--mono); font-size: .82rem; font-weight: 600;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2);
}
.score-btn:hover:not(:disabled) { border-color: currentColor; }
.score-btn.on { color: #fff; border-color: transparent; box-shadow: var(--shadow); }
.score-btn.on.v0  { background: var(--s0); }  .score-btn.on.v1  { background: var(--s1); }
.score-btn.on.v2  { background: var(--s2); }  .score-btn.on.v3  { background: var(--s3); }
.score-btn.on.v4  { background: var(--s4); }  .score-btn.on.v5  { background: var(--s5); }
.score-btn.on.v6  { background: var(--s6); }  .score-btn.on.v7  { background: var(--s7); }
.score-btn.on.v8  { background: var(--s8); }  .score-btn.on.v9  { background: var(--s9); }
.score-btn.on.v10 { background: var(--s10); }
.score-btn:disabled { opacity: .3; }
.na { font-size: .83rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: .3rem;
  cursor: pointer; }
.na input { width: auto; }
.chosen { font-size: .84rem; color: var(--ink-2); margin: 0 0 .5rem; padding-left: .1rem; }
.chosen b { color: var(--ink); }

.q-extras-box { margin-top: .1rem; }
.q-extras-summary { cursor: pointer; list-style: none; display: flex; align-items: center;
  gap: .45rem; font-size: .82rem; color: var(--accent); padding: .2rem 0; }
.q-extras-summary::-webkit-details-marker { display: none; }
/* Started or not started, in the words a task list uses. The arrow means open and closed. */
.q-extras-count.empty { color: var(--ink-3); }
.q-extras-count.filled { color: var(--accent); font-weight: 600; }
.q-extras-summary::before { content: '+'; font-family: var(--mono); font-weight: 700; }
details[open] > .q-extras-summary::before { content: '\2212'; }
.q-extras-count { color: var(--ink-3); font-size: .76rem; }
.q-extras { padding-top: .2rem; }

/* ---------- evidence -------------------------------------------------------------------- */

/* The evidence used to be the only tinted block inside a question, which made the evidence
   read as the separated thing and the question read as background. The tint moved to the
   answering, and the evidence sits on the card's own ground with a border. */
.evidence { background: var(--surface); border: 1px dashed var(--line-2);
  border-radius: var(--radius-sm); padding: .55rem .65rem; margin: .5rem 0 .2rem; }
.q-ans { background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: .55rem .7rem .3rem; margin: .5rem 0 .3rem; }
.q-ans .field { margin-bottom: .5rem; }
.q-ans .chosen { margin-bottom: .5rem; }
.ev-head { display: flex; gap: .5rem; flex-wrap: wrap; align-items: baseline; margin-bottom: .3rem; }
.ev-head strong { font-size: .85rem; }
.ev-item { border-top: 1px dashed var(--line-2); padding: .45rem 0; }
.ev-item:first-of-type { border-top: 0; padding-top: .1rem; }
.ev-item.unmarked { background: var(--bad-bg); border-radius: var(--radius-sm);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--bad) 30%, transparent); padding: .45rem .5rem; }
.ev-row  { display: grid; grid-template-columns: 1.6fr .85fr 1.15fr auto; gap: .3rem; }
.ev-row2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: .3rem; margin-top: .3rem; }
.ev-alt { display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; margin-top: .3rem; }
.att { display: inline-flex; align-items: center; gap: .4rem; background: var(--good-bg);
  border: 1px solid color-mix(in srgb, var(--good) 35%, transparent);
  border-radius: 7px; padding: .18rem .4rem; }
.att-name { font-weight: 600; font-size: .83rem; max-width: 15rem; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.ev-list { padding-left: 1.1rem; }
select.needs-marking { border-color: var(--bad); background: var(--bad-bg); }

/* ---------- marking --------------------------------------------------------------------- */

.marking-banner {
  display: block; width: 100%; border: 0; border-radius: 0;
  text-align: center; font-weight: 800; letter-spacing: .14em; font-size: .7rem;
  padding: .3rem; text-transform: uppercase;
  background: #14161b; color: #e8eaee;
  border-bottom: 1px solid #2b303a;
}
button.marking-banner { cursor: pointer; }
button.marking-banner:hover { filter: brightness(1.25); background: #2a1414; }

/**
 * Unmarked is a dark plate with a red glow, so it reads as a warning light. Flat red on a
 * full-width strip was loud enough to be tuned out.
 */
.marking-banner.unmarked {
  background: #1b0e0e;
  color: #ff9d92;
  border-bottom: 1px solid rgba(255, 90, 70, .55);
  box-shadow: 0 0 22px rgba(200, 40, 30, .55), inset 0 0 26px rgba(190, 35, 25, .30);
  text-shadow: 0 0 10px rgba(255, 110, 90, .75);
  animation: marking-pulse 2.6s ease-in-out infinite;
}
@keyframes marking-pulse {
  0%, 100% { box-shadow: 0 0 16px rgba(200, 40, 30, .40), inset 0 0 20px rgba(190, 35, 25, .22); }
  50%      { box-shadow: 0 0 30px rgba(220, 50, 40, .72), inset 0 0 32px rgba(200, 40, 30, .38); }
}
@media (prefers-reduced-motion: reduce) {
  .marking-banner.unmarked { animation: none; }
}

.marking-banner.print-only { display: none; }
.marking-row { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .45rem; }

/* Unclassified is the answer, so it is one row on its own and carries the weight of one. */
.mark-default { margin-bottom: .9rem; }
.mark-default .marking-chip { font-size: 1rem; padding: .5rem 1.1rem; font-weight: 600;
  border-color: var(--accent-line); }
.mark-families { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .8rem; }
.mark-family { border: 0; border-left: 3px solid var(--line-2); margin: 0; padding: 0 0 0 .75rem; }
.mark-family legend { font-size: .72rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3); padding: 0; }
.mark-family p { margin: .1rem 0 .4rem; }
.mark-family .marking-row { margin-bottom: 0; }

.mark-advice { border-left: 3px solid var(--warn); background: var(--warn-bg);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: .7rem .85rem; margin-top: 1rem; }
.mark-advice-head { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap;
  margin-bottom: .3rem; }
.mark-advice ol.steps { padding-left: 1.2rem; }
.mark-advice code.mono { display: inline-block; margin: .15rem 0; }
code.mark-subject { display: block; margin: .25rem 0; }
.mark-ack { display: flex; align-items: flex-start; gap: .4rem; font-size: .86rem; font-weight: 600;
  margin-top: .5rem; cursor: pointer; }
.mark-ack input { width: auto; margin-top: .25rem; }
.marking-chip {
  display: inline-flex; align-items: center; gap: .35rem; cursor: pointer;
  border: 1px solid var(--line-2); border-radius: 999px; padding: .28rem .75rem;
  background: var(--surface); font-size: .865rem;
}
.marking-chip:hover { border-color: var(--accent-line); }
.marking-chip.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600;
  box-shadow: 0 0 0 1px var(--accent); }
.marking-chip input { width: auto; }
.marking-inline { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; border: 1px solid var(--ink-2); color: var(--ink-2);
  padding: .05rem .4rem; border-radius: 4px; margin-top: .3rem; }
.marking-inline.unmarked { border-color: var(--bad); color: var(--bad); }

/* ---------- sticky footer --------------------------------------------------------------- */

/* The other half of the chrome: fixed to the bottom edge, full width, and tinted the same way
   the header is so both read as frame and the page between them reads as content.
   A previous version faked full width with a 100vw margin, which made the page scroll
   sideways. */
.sticky-footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--chrome-bg);
  border: 0; border-top: 1px solid var(--chrome-line);
  border-radius: 0;
  padding: 0 1.15rem;
  box-shadow: 0 -12px 22px -12px rgba(16, 24, 40, .5);
}
.sticky-footer > .progress-row,
.sticky-footer > .footer-inner { max-width: 1200px; margin-inline: auto; }
/* The gate is a band across the whole bar. Capping it at the content width left the colour
   stopping short of both edges, which read as a mistake. */
.sticky-footer > .gate-band { margin: 0 -1.15rem; }
@media (prefers-color-scheme: dark) {
  .sticky-footer { box-shadow: 0 -14px 26px -12px rgba(0, 0, 0, .85); }
}
.footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  flex-wrap: wrap; padding: .5rem 0 .6rem; }
.sticky-footer .pill { background: var(--surface); }
.footer-score { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
/* Where the work is kept. It sits in the chrome, so every screen carries it, and it never
   disappears on a narrow screen: the wording shortens instead. */
/* The question-set library. One row per set, the one in use marked. */
.set-h2 { font-size: 1rem; margin: 1.4rem 0 .2rem; display: flex; gap: .4rem; align-items: baseline; }
.set-list { display: flex; flex-direction: column; gap: .4rem; margin: .6rem 0 .8rem; }
.set-list-row { display: flex; gap: .8rem; align-items: flex-start; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: .6rem .75rem; }
.set-list-row.on { border-color: var(--accent-line); background: var(--accent-soft); }
.set-list-row p { margin: .15rem 0 0; }
/* The empty-pool state. The cat takes the page's ink colour, so it belongs to the theme. */
.pool-out { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
/* The row above a list of loaded submissions. Without a rule of its own its three children
   touched, which is the same crowding the empty state had between its badge and its button. */
.pool-in { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap;
  margin-bottom: .7rem; }

/* ---------- the assessor and admin screens, on the results page's ratio ------------------
 * The three tiers the note above arrived at: .5rem to .85rem inside a block, 1.9rem between
 * two parts, 2.9rem and a rule between regions. Against 1.05rem of card padding that is 2.76.
 * These two screens were running at 0.81: a card margined .85rem below and padded 1.05rem
 * inside, so two unrelated blocks were 3.2px CLOSER together than a heading was to its own
 * content. Every complaint about buttons crowding the text follows from that one inversion.
 * --------------------------------------------------------------------------------------- */
/**
 * The assessor's column is wider than the submitter's, because what it holds is different.
 *
 * The submitter reads prose, and 940px is a reading measure. The assessor reads a twelve-column
 * table of every submission, and at 940px that table could not fit: it overflowed its box by
 * 309px and turned into a sideways scroll, reported as "the preview is longer horizontally than
 * the box given for it". 1200px is the width the questionnaire already uses, so this is not a
 * new number, and the three declarations under it take the table's own floor from 1173px to
 * 413px so it fits here and on a 1024px laptop.
 */
.body-review, .body-admin { padding-bottom: 3rem; max-width: 1200px; }
/* A badge that cannot wrap is a column that cannot shrink. */
.triage .badge { white-space: normal; margin-left: 0; }
.triage td { overflow-wrap: anywhere; }
/* A heading may wrap onto two lines. A button in a cell may not: "Open" broke in half. */
.triage th { white-space: normal; line-height: 1.15; vertical-align: bottom; }
.triage .row-acts { display: flex; gap: .3rem; align-items: center; justify-content: flex-end; }
.triage .row-acts button { white-space: nowrap; }
/* A tag sitting against the word beside it reads as part of it. */
.triage .tag { display: inline-block; margin-top: .22rem; }
.triage td:first-child .tag { margin-left: .4rem; }
/* Only the bottom margin is reset. `> section` outranks `> * + *`, so resetting all four
   sides here silently cancelled the gap below, which is how the first version of this measured
   0px between two cards. */
.body-review > section, .body-admin > section { margin-bottom: 0; }
.body-review > * + *, .body-admin > * + * { margin-top: 2.9rem; }
.body-review > .card.warn + * { margin-top: 1.9rem; }

/**
 * A control group carries its own distance from what is above it.
 *
 * .actions had no top margin at all, so its gap was whatever the element above happened to
 * leave: zero after a table, zero after every heading, 8px after one paragraph, 12px after a
 * field. On both list screens the export button's own border was touching the table's closing
 * rule at 0px while being 8px from the button beside it, which puts a control closer to
 * content it has nothing to do with than to its own group.
 */
.body-review .card > .actions, .body-admin .card > .actions,
.body-review .card > .field + .actions, .body-admin .card > .field + .actions,
.res-region > .actions, .res-sub > .actions { margin-top: 1.15rem; }

/* A heading with zero space under it is a heading that has joined its own content. */
.body-review h2 + *, .body-admin h2 + *,
.body-review h1 + *, .body-admin h1 + * { margin-top: .5rem; }
.body-review .card > h2, .body-admin .card > h2 { margin-bottom: 0; }

/* The controls that belong to a table go above it, where they read as its toolbar. */
.res-toolbar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  margin: .85rem 0 .7rem; }
.res-toolbar .spacer { flex: 1 1 auto; }
.btn-icon { display: inline-flex; align-items: center; gap: .4rem; }
.btn-icon svg { flex: none; }
.menu-sep { height: 1px; background: var(--line); margin: .3rem 0; }
/* Open, and a menu beside it. The menu is where anything that removes a row goes. */
.row-acts { display: flex; align-items: center; gap: .35rem; justify-content: flex-end; }

/* ---------- the access code ---------------------------------------------------------------
 * One box per character, three groups of four, the way a verification code is typed. The
 * dashes are drawn and never typed.
 * ------------------------------------------------------------------------------------------ */
/* One line, at every width. The boxes share whatever room there is and stop growing at a
   comfortable size, so twelve of them never wrap and the three groups stay a shape somebody
   can match against the message they were sent. */
.code-field { display: flex; align-items: center; gap: .3rem; flex-wrap: nowrap;
  margin: .5rem 0; width: 100%; }
/* input[type=text] sets width: 100% and outranks a bare class, which is why these spanned the
   whole window. The selector has to carry the element too. */
input.code-box { flex: 1 1 0; min-width: 0; max-width: 2.4rem; width: auto;
  height: 2.6rem; padding: 0; text-align: center;
  font-family: var(--mono); font-size: 1.05rem; font-weight: 650; text-transform: uppercase;
  border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink); }
input.code-box:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.code-dash { flex: 0 0 auto; color: var(--ink-3); padding: 0 .1rem; user-select: none; }
/* The code as somebody reads it back, beside a way to take a copy of it. */
.code-shown { display: inline-flex; align-items: center; gap: .55rem; flex-wrap: wrap;
  padding: .45rem .7rem; border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  background: var(--surface-2); font-family: var(--mono); font-size: 1rem;
  letter-spacing: .06em; }
.share-code-row { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap;
  margin: .4rem 0 .9rem; }

/* A code is never plain text: it is the only way back to an assessment, so it is always a
   thing you can take a copy of. */
.code-chip { display: inline-flex; align-items: center; gap: .5rem; }
.code-chip-btn { display: inline-flex; align-items: center; gap: .5rem;
  padding: .35rem .6rem; border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--ink); cursor: pointer; }
.code-chip-btn:hover { border-color: var(--accent-line); color: var(--accent); }
.code-chip-value { font-family: var(--mono); font-size: .95rem; letter-spacing: .06em; }
.code-chip-ico { display: inline-flex; color: var(--ink-3); }
.code-chip-btn:hover .code-chip-ico { color: var(--accent); }
.code-chip-said { font-size: .76rem; color: var(--good); }
@media (max-width: 480px) {
  input.code-box { height: 2.3rem; font-size: .9rem; }
  .code-field { gap: .2rem; }
}
.pool-art { flex: none; width: 148px; color: var(--accent); }
.sad-cat { display: block; width: 100%; height: auto; }
.pool-out h2 { margin: 0 0 .3rem; }
.pool-out p { margin: 0 0 .5rem; max-width: 48ch; }
.pool-alt-h { font-size: .95rem; margin: 1.2rem 0 .2rem; padding-top: .9rem;
  border-top: 1px solid var(--line); }
@media (max-width: 620px) { .pool-art { width: 108px; } }

.set-list-main { min-width: 0; }
.set-list-act { display: flex; gap: .35rem; align-items: center; flex: none; }

/* The three-dot menu. Preview, make active, delete, and who added it. */
.set-menu { position: relative; }
.set-menu-btn { list-style: none; cursor: pointer; display: grid; place-items: center;
  width: 1.8rem; height: 1.8rem; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface-2); color: var(--ink-2); font-size: 1rem; line-height: 1; }
.set-menu-btn::-webkit-details-marker { display: none; }
.set-menu-btn:hover { border-color: var(--accent-line); color: var(--accent); }
.set-menu-pop { position: absolute; right: 0; top: 2.1rem; z-index: 5; min-width: 15rem;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px;
  box-shadow: var(--shadow-lg); padding: .25rem; display: flex; flex-direction: column; }
.menu-item { text-align: left; background: none; border: 0; border-radius: 7px;
  padding: .4rem .55rem; font-size: .85rem; color: var(--ink); cursor: pointer; }
.menu-item:hover { background: var(--surface-2); border: 0; }
.menu-item.is-off { color: var(--ink-3); cursor: default; }
.menu-item.is-off:hover { background: none; }
.menu-danger { color: var(--bad); font-weight: 600; }
.menu-danger:hover { background: var(--bad-bg); }

/* A control that does not work yet. Yellow, and always beside something disabled. */
.badge-mockup { background: var(--warn-bg); color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
button.is-mockup, a.is-mockup { opacity: .62; cursor: not-allowed; }
.mockup-row { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }

/* Sharing. One list, grouped by what somebody was added as. */
.share-dialog { max-width: 34rem; }
.share-group { margin: .9rem 0 .35rem; font-size: .82rem; letter-spacing: .01em; }
.share-row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  padding: .35rem 0; border-top: 1px solid var(--line); }
.share-add { display: block; margin: .7rem 0 .5rem; }
.share-add input { width: 100%; }
.share-roles { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .6rem; }
.chip { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
  border-radius: 999px; padding: .18rem .6rem; font-size: .76rem; cursor: pointer; }
.chip.on { border-color: var(--accent-line); background: var(--surface); color: var(--accent);
  font-weight: 600; }
.menu-note { border-top: 1px solid var(--line); margin-top: .2rem; padding: .35rem .55rem .15rem; }

.set-preview { margin: .5rem 0 .2rem; padding: .5rem .6rem; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 8px; }
.set-preview .kv { margin: 0 0 .4rem; }
.set-preview-q { margin: 0; padding-left: 1.1rem; }
.set-preview-q li { margin-bottom: .15rem; }
.kv.tight dt, .kv.tight dd { padding: .1rem 0; }
/* A button with an icon beside a label. Without this the two sat on the text baseline and the
   icon rode high, which read as a mistake rather than a control. */
.btn-icon { display: inline-flex; align-items: center; gap: .4rem; }
.btn-icon svg { flex: none; display: block; }

.danger-text { color: var(--bad); }
.danger-text[disabled] { color: var(--ink-3); }

.sitefoot .proto { color: var(--warn); font-weight: 600; }

.ref-line { margin: .1rem 0 .6rem; color: var(--ink-2); }

/* A note line. Neither a question nor an instruction: a fact somebody needs once, so it reads
   as an aside and not as another paragraph of the form. */
.note-line { display: flex; align-items: baseline; gap: .45rem; flex-wrap: wrap;
  margin: .2rem 0 .9rem; padding: .4rem .6rem; border-left: 2px solid var(--line-2);
  background: var(--surface-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: .78rem; }
.note-key { text-transform: uppercase; letter-spacing: .08em; font-size: .66rem;
  font-weight: 700; color: var(--ink-3); }
.note-line b.mono { letter-spacing: .08em; color: var(--ink); }
.note-say { color: var(--ink-3); flex: 1 1 16rem; min-width: 0; }
.ref-line b { letter-spacing: .08em; }
.ref-chip { display: inline-block; border: 1px solid var(--line-2); border-radius: 5px;
  padding: 0 .25rem; letter-spacing: .06em; }

.ev-subject { margin: .35rem 0 .1rem; }
.ev-subject-row { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.ev-subject code { background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 6px; padding: .2rem .4rem; font-size: .78rem; word-break: break-word; }

.marking-banner .mark-note { font-weight: 600; letter-spacing: .04em; opacity: .8;
  text-transform: none; margin-left: .5rem; }

/* Two letters, so it takes no room in a header that is already full. */
/* One link naming the other language, which is the Canada.ca pattern. It sits at the height of
   the settings button beside it, and collapses to two letters where the header runs out of room. */
.lang-link { display: inline-flex; align-items: center; height: 33px; padding: 0 .35rem;
  font-size: .78rem; font-weight: 600; white-space: nowrap; text-decoration: none; }
.lang-link:hover { text-decoration: underline; }
.lang-link abbr { text-decoration: none; text-transform: uppercase; letter-spacing: .04em; }
.lang-abbr { display: none; }

.save-state { display: inline-flex; align-items: center; gap: .35rem; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 999px; padding: .16rem .55rem; color: var(--ink-2); white-space: nowrap; }
.save-state:hover { border-color: var(--accent-line); color: var(--accent); }
.save-state.hidden { display: none; }
.save-state .ss-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--ink-3); }
.save-state.st-online { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.save-state.st-online .ss-dot { background: var(--good); }
/* Saved once and edited since. Amber, because nothing is lost and something is owed: the copy
   an assessor reads is older than the one on screen until the button is pressed again. */
.save-state.st-behind { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.save-state.st-behind .ss-dot { background: var(--warn); }
.save-state.st-failed { color: var(--bad); font-weight: 600;
  border-color: var(--bad); background: var(--bad-bg); }
.save-state .ss-short { display: none; }
.save-state .spin { width: 9px; height: 9px; border-radius: 999px;
  border: 1.5px solid var(--line-2); border-top-color: var(--accent);
  animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .save-state .spin { animation: none; } }
@media (max-width: 720px) {
  .save-state .ss-long { display: none; }
  .save-state .ss-short { display: inline; }
  .lang-full { display: none; }
  .lang-abbr { display: inline; }
}
.footer-actions { display: flex; gap: .45rem; }
.progress-row { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr);
  gap: .5rem 1rem; padding: .5rem 0 0; }
.pbar { display: grid; gap: .2rem; }
.pbar-label { font-size: .72rem; color: var(--ink-3); font-weight: 600;
  font-variant-numeric: tabular-nums; }
.progress-shell { height: 5px; border-radius: 999px; background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.progress-shell i { display: block; height: 100%; border-radius: 999px; background: var(--accent);
  transition: width .3s cubic-bezier(.4, 0, .2, 1); }
.progress-shell i.done { background: var(--good); }
.progress-shell i.celebrate { animation: section-done 1s ease-out; }
@keyframes section-done {
  0%   { box-shadow: 0 0 0 0 rgba(31, 107, 60, .0); filter: brightness(1); }
  25%  { box-shadow: 0 0 14px 3px rgba(31, 107, 60, .75); filter: brightness(1.5); }
  100% { box-shadow: 0 0 0 0 rgba(31, 107, 60, .0); filter: brightness(1); }
}
@media (prefers-reduced-motion: reduce) {
  .progress-shell i { transition: none; }
  .progress-shell i.celebrate { animation: none; }
}

.gate-band { background: var(--warn-bg);
  border-bottom: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.gate { max-width: 1200px; margin-inline: auto; color: var(--warn);
  padding: .4rem 1.15rem; font-size: .84rem;
  display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; }
.gate-marks { display: flex; gap: .25rem; flex-wrap: wrap; }
.mark-btn { font-size: .76rem; padding: .16rem .5rem; border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--surface);
  color: var(--ink); }
.mark-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- scores ---------------------------------------------------------------------- */

.pill { display: inline-grid; place-items: center; min-width: 2.5rem; font-family: var(--mono);
  font-weight: 700; font-size: .85rem; padding: .12rem .45rem; border-radius: 999px;
  border: 1px solid currentColor; }
.pill.small { min-width: 1.95rem; font-size: .78rem; }
.t0  { color: var(--s0);  } .t1  { color: var(--s1);  } .t2  { color: var(--s2);  }
.t3  { color: var(--s3);  } .t4  { color: var(--s4);  } .t5  { color: var(--s5);  }
.t6  { color: var(--s6);  } .t7  { color: var(--s7);  } .t8  { color: var(--s8);  }
.t9  { color: var(--s9);  } .t10 { color: var(--s10); }
.tnone { color: var(--ink-3); }
td.t0, td.t1, td.t2, td.t3, td.t4, td.t5, td.t6, td.t7, td.t8, td.t9, td.t10 { font-weight: 700; }

.headline { display: flex; gap: 1.15rem; align-items: flex-start; flex-wrap: wrap; }
.bigscore { flex: 0 0 auto; border-radius: var(--radius); padding: .7rem 1.15rem; text-align: center;
  border: 1px solid currentColor; background: var(--surface-2); }
.bigscore .num { display: block; font-size: 2.5rem; font-weight: 750; line-height: 1;
  letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.bigscore .outof { font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 650; }
.headline-text { flex: 1 1 20rem; min-width: 0; }

.band, .maturity { border-left: 3px solid; padding: .45rem .7rem; margin: .55rem 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.band.good    { border-color: var(--good); background: var(--good-bg); }
.band.neutral { border-color: var(--ink-3); background: var(--surface-2); }
.band.bad     { border-color: var(--bad);  background: var(--bad-bg); }
.maturity     { border-color: var(--accent); background: var(--accent-soft); }

/**
 * Inside the verdict, one tinted panel and no more.
 *
 * A card holding four bordered, tinted panels is the same fault as a page holding ten cards,
 * one level down: everything emphasised, so nothing is. The routing band keeps its fill,
 * because routing is the one thing on this card somebody is looking for. The maturity line and
 * the completeness line keep their coloured left rule, which is what carries the meaning, and
 * lose the fill and the padding that made them boxes.
 */
.verdict .maturity, .verdict .completeness { background: none; padding: .1rem 0 .1rem .7rem;
  border-radius: 0; margin: .5rem 0; }
.verdict .completeness.partial, .verdict .completeness.full { background: none; }

.completeness { border-left: 3px solid var(--line-2); padding: .45rem .7rem; margin: .55rem 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: var(--surface-2); }
.completeness.partial { border-color: var(--warn); background: var(--warn-bg); }
.completeness.full { border-color: var(--good); background: var(--good-bg); }
.completeness-bar { height: 4px; border-radius: 999px; background: var(--line);
  overflow: hidden; margin-bottom: .35rem; }
.completeness-bar i { display: block; height: 100%; background: var(--warn); }
.completeness.full .completeness-bar i { background: var(--good); }

.bar-row { display: grid; grid-template-columns: minmax(9rem, 14rem) 1fr 3.2rem; gap: .7rem;
  align-items: center; margin-bottom: .45rem; }
.bar-label { font-size: .885rem; }
.bar-track { background: var(--surface-2); border-radius: 999px; height: .55rem; overflow: hidden;
  box-shadow: inset 0 0 0 1px var(--line); }
.bar-fill { height: 100%; border-radius: 999px; transition: width .25s ease; }
.b0{background:var(--s0)} .b1{background:var(--s1)} .b2{background:var(--s2)} .b3{background:var(--s3)}
.b4{background:var(--s4)} .b5{background:var(--s5)} .b6{background:var(--s6)} .b7{background:var(--s7)}
.b8{background:var(--s8)} .b9{background:var(--s9)} .b10{background:var(--s10)}
.bnone{background:var(--line-2)}
.bar-num { text-align: right; font-family: var(--mono); font-weight: 700; font-size: .87rem; }

.backlog-item { border-top: 1px solid var(--line); padding: .7rem 0; }
.backlog-item:first-of-type { border-top: 0; }
.steps { margin: .35rem 0; padding-left: 1.15rem; }
