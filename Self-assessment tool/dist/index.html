</svg>`;var pe={fileType:"gc-arch-rubric",formatVersion:2,id:"gc-ea-assessment",version:"1.0-dan",status:"draft",title:"GC Enterprise Architecture self-assessment",provenance:`Imported by tools/import-rubric.mjs from Dan's GC_EA_Assessment_Tool workbook (6 sheets) in "EARB target state knowledge base". Questions, section names, section weights, domain weights and the 0-10 ladder are all his. Added by us and marked as such: lifecycle stages, the stage rule on "Defining the Current State" sections, and the routing bands.`,dlgBaseUrl:"https://myermcat.github.io/digital-lifecycle-guide",dlgBaseUrlNote:"The guide, on GitHub Pages for now. Each stage points at its own page there.",importWarnings:["Business Architecture: the section weights in the workbook add up to 80%, not 100%. The missing 20 points are shared out across the 6 sections that are there, in proportion, so the domain still scores out of 10. Worth checking whether a section was left out of the export."],scale:{min:0,max:10,anchors:[{value:0,colour:"Black",name:"Absent",label:"No formal architecture. Capabilities are missing, and manual workarounds are the only way to achieve business outcomes."},{value:1,colour:"Dark Red",name:"Critical Gaps",label:"A skeleton exists, but core capabilities (like security or data integrity) are missing. High risk of systemic failure."},{value:2,colour:"Red",name:"Fragmented",label:'Capabilities exist in "silos." They are inconsistent, undocumented, and require constant manual intervention to stay synchronized.'},{value:3,colour:"Orange",name:"Emergent",label:'Core capabilities are present but brittle. The architecture meets the "happy path" but fails under stress or edge cases.'},{value:4,colour:"Orange-Yellow",name:"Defined",label:"The architecture meets basic functional requirements. Documentation exists, but Quality Attributes (scalability, maintainability) are an afterthought."},{value:5,colour:"Yellow",name:"Integrated",label:"This is the Baseline. All desired capabilities are present and connected. The system is stable and performs as expected under normal conditions."},{value:6,colour:"Yellow-Green",name:"Managed",label:"Capabilities are monitored and measured. The architecture can handle predictable growth and has basic fault tolerance."},{value:7,colour:"Green",name:"Scalable & Secure",label:'The architecture is "hardened." It handles bursts in demand effortlessly and has proactive security measures built into the design.'},{value:8,colour:"Dark Green",name:"Agile/Extensible",label:"The architecture is modular. Adding a new desired capability does not require a rewrite; the system is designed to be plugged into and extended."},{value:9,colour:"Blue",name:"Predictive",label:"The architecture uses telemetry and AI/ML to anticipate needs (e.g., auto-scaling before a spike or self-healing before a crash)."},{value:10,colour:"Purple",name:"Symbiotic",label:'The "North Star" state. The architecture and business strategy are one. The system is so flexible it can pivot to entirely new business models with minimal architectural friction.'}]},maturityBands:[{min:9,label:"Leading Practice",detail:"Predictive, self-optimizing, fully aligned with business strategy."},{min:7,label:"Advanced",detail:"Hardened, scalable, and modular. Demonstrably high-quality architecture."},{min:5,label:"Baseline Ready",detail:"Core capabilities present and stable. Meets minimum GC EA expectations."},{min:3,label:"Developing",detail:"Foundational elements exist but architecture is immature and at risk under stress."},{min:0,label:"Critical Risk",detail:"Immediate intervention required. Core capabilities absent or severely compromised."}],maturityBandsNote:"Dan's own reference guide, from the Summary Dashboard sheet.",bands:[{id:"showcase",min:8.5,label:"Showcase",routing:"No board slot needed. TBS may ask to showcase this work.",tone:"good"},{id:"hallpass",min:6,label:"Hall pass",routing:"Suggested: no GC EARB appearance required. Subject to audit sample.",tone:"good"},{id:"routine",min:3,label:"Routine",routing:"Suggested: no board time. Assessor spot-check only.",tone:"neutral",source:"interpolated"},{id:"attend",min:0,label:"Bring it to the board",routing:"Suggested: attend GC EARB. Come and tell us why, and what the plan is.",tone:"bad"}],bandsNote:'ROUTING, not maturity, and provisional. Dan named three numbers out loud on 2026-08-26: above roughly 60% is an automatic hall pass, around 8.5 is worth showcasing, and around 2 out of 10 means come and explain. He also said the 4, 5, 6 middle is not worth board time. The 3.0 line between "come and explain" and "no board time" is OURS, interpolated to bridge the 2 he named and the 4 he named. He has not seen it. None of these are signed off. The maturity labels above are his.',stageMultipliers:{"low-ok":.25,expected:1,critical:1.5},stageMultipliersNote:'Our addition. Lifecycle stage is not captured in the current process at all - Dan named it as the key missing field. Only "Defining the Current State" sections carry a rule so far.',topics:[{id:"business",label:"Business",note:"Strategy, process, value and cost."},{id:"data",label:"Data",note:"Models, quality, lineage and stewardship."},{id:"application",label:"Application",note:"What the software does and depends on."},{id:"technology",label:"Technology",note:"Where it runs, and whether it stays up."},{id:"security",label:"Security",note:"Cuts across all four. Dan asked for this one by name."},{id:"privacy",label:"Privacy",note:"Personal information specifically, not data in general."}],answerTypesNote:"PROVISIONAL. Dan named this defect: several questions are yes or no wearing a 0 to 10 scale. The ones marked yesno here are the ones whose wording is unambiguously binary. He owns the real list. A no on a yes/no question raises a red flag: it colours the section and the person carries on. Nothing in this tool stops an assessment.",topicsNote:"A second axis, not a second scoring spine. The four domains still produce the overall score, and a question counts once there. A question also counts at full weight inside every topic it carries, which is where the weights genuinely differ. Domain topics are mechanical. Security and privacy were derived from the question wording and are PROVISIONAL: Dan owns the real assignments.",lifecycleStages:[{id:"discovery",label:"Discovery",phase:"Create",dlgPath:"create-discovery",blurb:"Understanding the problem. There may be no current solution to describe yet."},{id:"alpha",label:"Alpha",phase:"Create",dlgPath:"create-alpha",blurb:"Testing whether an approach can work, with real users."},{id:"beta",label:"Beta",phase:"Create",dlgPath:"create-beta",blurb:"Building the real thing in public, at growing scale."},{id:"stabilization",label:"Stabilization",phase:"Live",dlgPath:"live-stabilization",blurb:"In service, settling down. Costs and operations should be known."},{id:"growth",label:"Growth",phase:"Live",dlgPath:"live-growth",blurb:"In service, scaling up."},{id:"maturity",label:"Maturity",phase:"Live",dlgPath:"live-maturity",blurb:"In service, steady state. Everything should be documented and measured."},{id:"sunset",label:"Sunset",phase:"Sunset",dlgPath:"sunset",blurb:"Replacing or retiring. Dependencies and data disposition matter most."}],phases:[{name:"Create",dlgPath:"create",blurb:"Being built, and not in service yet."},{name:"Live",dlgPath:"live",blurb:"In service, with real users."},{name:"Sunset",dlgPath:"sunset",blurb:"Being replaced or retired."}],domains:[{id:"business",label:"Business Architecture",weight:25,description:"Connecting strategy to execution through structured design",sections:[{id:"defining-the-current-state",label:"Defining the Current State",weight:5,questions:[{id:"B-Q1",sheetRef:"Q1",text:"How thoroughly has the current state of this solution been documented, including all processes, data flows, and system dependencies?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q2",sheetRef:"Q2",text:"What entities (data objects, records, clients, files) are currently produced, managed, or maintained by this solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q3",sheetRef:"Q3",text:"Have all roles and responsibilities across stakeholders, operators, and service consumers been identified, documented, and formally accepted?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q4",sheetRef:"Q4",text:"How well understood is the criticality of this solution to Government of Canada program delivery and citizen outcomes?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q5",sheetRef:"Q5",text:"Are all sub-components of the current solution assessed for their individual criticality, availability, and risk exposure?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q6",sheetRef:"Q6",text:"What is the current level of utilization and demand for the solution (transaction volumes, active users, peak load)?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q7",sheetRef:"Q7",text:"What is the known availability, uptime, and service continuity record of the current solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q8",sheetRef:"Q8",text:"How well understood are the total lifecycle costs \u2014 including build, operate, maintain, and decommission \u2014 of the current solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q9",sheetRef:"Q9",text:"What are the current unit economics (cost per transaction, cost per entity managed) and how are they tracked?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q10",sheetRef:"Q10",text:"How mature and current are the performance indicators for this solution, and what trends do they reflect?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q11",sheetRef:"Q11",text:"Is the lifespan and full lifecycle of the solution mapped out, and is the current position within that lifecycle known?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q12",sheetRef:"Q12",text:"What major events (technology refresh, contract renewal, legislative changes) are on the horizon for this solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q13",sheetRef:"Q13",text:"How well understood are the specific skills, staffing levels, and capacity requirements to operate and evolve this solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q14",sheetRef:"Q14",text:"How are universal requirements \u2014 accessibility, official languages, inclusion, and privacy \u2014 currently addressed in the solution?",weight:1,answerType:"scale",topics:["business","privacy"]}],stageExpectation:{discovery:"low-ok",alpha:"low-ok"},shareOfDomain:6.3},{id:"defining-the-business-solution",label:"Defining the Business Solution",weight:25,questions:[{id:"B-Q15",sheetRef:"Q15",text:"How clearly and completely has the core business problem been defined and agreed upon by all stakeholders?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q16",sheetRef:"Q16",text:"Is there a documented business case that articulates the expected value, outcomes, and measurable benefits of the proposed solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q17",sheetRef:"Q17",text:"How well do the proposed solution capabilities map to the GC Business Capability Model and existing enterprise services?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q18",sheetRef:"Q18",text:"Have value streams been fully mapped, showing how business capabilities deliver outcomes to clients and citizens?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q19",sheetRef:"Q19",text:"Is the solution design driven by defined user personas, journeys, and evidence-based user research?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q20",sheetRef:"Q20",text:"How clearly are the target service levels, response times, and quality benchmarks defined for the proposed solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q21",sheetRef:"Q21",text:"Has the solution's criticality to GC program delivery been assessed, and does the architecture reflect that criticality?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q22",sheetRef:"Q22",text:"Is there a funding model and sourcing strategy that is sustainable across the full lifecycle of the solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q23",sheetRef:"Q23",text:"How well is the talent strategy defined, including required skills, existing capacity, training pipeline, and long-term retention?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q24",sheetRef:"Q24",text:"Is a demand forecast available, and does the solution design account for projected growth and usage variability?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q25",sheetRef:"Q25",text:"How well is the solution integrated within the broader GC enterprise ecosystem and aligned with whole-of-government priorities?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q26",sheetRef:"Q26",text:"Is the solution designed to maximize reuse of existing GC shared services and platforms before building new capabilities?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q27",sheetRef:"Q27",text:"How transparent is the solution design \u2014 is it documented, accessible, and understandable to those who rely on it?",weight:1,answerType:"scale",topics:["business"]}],shareOfDomain:31.3},{id:"demonstrated-engagement",label:"Demonstrated Engagement",weight:10,questions:[{id:"B-Q28",sheetRef:"Q28",text:"Have user personas, stories, and journeys been mapped and validated through direct engagement with actual users and stakeholders?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q29",sheetRef:"Q29",text:"Are there formal, repeatable mechanisms to capture client, user, and stakeholder needs on a continuous basis?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q30",sheetRef:"Q30",text:"How mature are feedback loops between the delivery team and end users, including Communities of Practice and regular reviews?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q31",sheetRef:"Q31",text:"Are all roles, accountabilities, and decision rights across the solution ecosystem clearly documented in a RACI or equivalent model?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q32",sheetRef:"Q32",text:"Is solution documentation, interactive guidance, and self-service assistance available and actively maintained for all user types?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q33",sheetRef:"Q33",text:"How transparent is the operational status of the solution, including an offering roadmap and historical event schedule?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q34",sheetRef:"Q34",text:"Are performance metrics (NPS, CSAT, CES, usage rates, drop-off rates) defined, measured, and reported back to stakeholders?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q35",sheetRef:"Q35",text:"Does the solution support multi-channel delivery patterns (web, chat, phone, in-person) that reflect real user demand?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q36",sheetRef:"Q36",text:"How mature are personalization, predictive analytics, or AI-assisted capabilities within the solution offering?",weight:1,answerType:"scale",topics:["business"]}],shareOfDomain:12.5},{id:"calculated-measured-and-transparent-performance-and-value",label:"Calculated, Measured & Transparent Performance & Value",weight:10,questions:[{id:"B-Q37",sheetRef:"Q37",text:"Are Service Level Objectives (SLOs) and Service Level Agreements (SLAs) formally defined, monitored, and reported?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q38",sheetRef:"Q38",text:"Is there end-to-end instrumentation of delivery processes, enabling real-time performance monitoring and visualization?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q39",sheetRef:"Q39",text:"How well are costs, prices, and unit economics tracked and published, enabling informed investment decisions?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q40",sheetRef:"Q40",text:"Are client satisfaction scores (CSAT, NPS, or equivalent) captured systematically and acted upon?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q41",sheetRef:"Q41",text:"How are quality and error rates measured, tracked, and used to drive continuous improvement?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q42",sheetRef:"Q42",text:"Are response times, total transaction times, and execution time variance measured and within defined thresholds?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q43",sheetRef:"Q43",text:"Is trend analysis performed regularly on key metrics to anticipate performance changes and drive proactive action?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q44",sheetRef:"Q44",text:"Are periodic evaluations of continuing business need performed to assess whether the solution still justifies its cost?",weight:1,answerType:"scale",topics:["business"]}],shareOfDomain:12.5},{id:"operational-readiness",label:"Operational Readiness",weight:10,questions:[{id:"B-Q45",sheetRef:"Q45",text:"How well-defined is the delivery pipeline, including deployment cadence, automation, rollback procedures, and success rates?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q46",sheetRef:"Q46",text:"Are skills requirements, staffing levels, and a training and improvement pipeline in place to sustain operations?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q47",sheetRef:"Q47",text:"Is there an established and confirmed funding strategy, including lifecycle funding beyond the initial build phase?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q48",sheetRef:"Q48",text:"How mature and tested is the incident management, business continuity, and disaster recovery planning for this solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q49",sheetRef:"Q49",text:"Is the infrastructure and technology acquisition strategy defined, including procurement pathways and lead times?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q50",sheetRef:"Q50",text:"Has a formal threat and risk assessment (including sovereignty and security classification) been completed and reviewed?",weight:1,answerType:"yesno",topics:["business","security"]},{id:"B-Q51",sheetRef:"Q51",text:"How deep and well-prioritized is the feature and requirements backlog, and does it reflect validated stakeholder needs?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q52",sheetRef:"Q52",text:"Are there operational runbooks, monitoring dashboards, and on-call processes in place to support production operations?",weight:1,answerType:"scale",topics:["business"]}],shareOfDomain:12.5},{id:"governance-and-strategy",label:"Governance & Strategy",weight:20,questions:[{id:"B-Q53",sheetRef:"Q53",text:"Is there a clearly defined governance model with accountable decision-makers for the solution's direction and performance?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q54",sheetRef:"Q54",text:"How well does the solution align with the GC Digital Operations Strategic Plan and departmental enterprise strategy?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q55",sheetRef:"Q55",text:"Is there a published roadmap with near, medium, and long-term milestones that is communicated to stakeholders?",weight:1,answerType:"yesno",topics:["business"]},{id:"B-Q56",sheetRef:"Q56",text:"How mature is the change management process, including impact assessment, approval workflows, and communication plans?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q57",sheetRef:"Q57",text:"Are compliance requirements (legal, regulatory, policy, accessibility, bilingualism) formally tracked and verified?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q58",sheetRef:"Q58",text:"Is there a formal risk register maintained for the solution, with assigned owners and documented mitigation strategies?",weight:1,answerType:"yesno",topics:["business"]},{id:"B-Q59",sheetRef:"Q59",text:"How well is vendor and third-party relationship governance defined, including performance monitoring and exit strategies?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q60",sheetRef:"Q60",text:"Is there a documented and approved data governance model aligned with the solution's information and privacy requirements?",weight:1,answerType:"scale",topics:["business","privacy"]},{id:"B-Q61",sheetRef:"Q61",text:"How well does the solution contribute to GC-wide shared service consolidation and enterprise architecture objectives?",weight:1,answerType:"scale",topics:["business"]}],shareOfDomain:25}]},{id:"data",label:"Data & Information Architecture",weight:25,description:"Turning raw data into trusted, connected insights",sections:[{id:"defining-the-current-state",label:"Defining the Current State",weight:10,questions:[{id:"D-Q1",sheetRef:"Q1",text:"How well documented are current data models, entity relationships, and data-sharing agreements?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q2",sheetRef:"Q2",text:"What is the degree of data fragmentation, duplication, and inconsistency across the current solution and its dependencies?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q3",sheetRef:"Q3",text:"How well understood are data volumes, growth rates, residency requirements, and encryption posture?",weight:1,answerType:"scale",topics:["data","security"]},{id:"D-Q4",sheetRef:"Q4",text:"Is the lifespan and full data lifecycle \u2014 from creation to disposition \u2014 mapped and governed?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q5",sheetRef:"Q5",text:"Are data formats proprietary or based on open, interoperable standards?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q6",sheetRef:"Q6",text:"How open and transparent is data publication, and is a default-open approach applied where appropriate?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q7",sheetRef:"Q7",text:"Are analytics and trend analysis capabilities available to support decision-making from current data assets?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q8",sheetRef:"Q8",text:"How mature are data access controls, auditing mechanisms, and the ability to trace who accessed what and when?",weight:1,answerType:"scale",topics:["data","security"]},{id:"D-Q9",sheetRef:"Q9",text:"How interoperable is the current data environment with other GC systems, programs, and platforms?",weight:1,answerType:"scale",topics:["data"]}],stageExpectation:{discovery:"low-ok",alpha:"low-ok"},shareOfDomain:10},{id:"data-architecture-and-standards",label:"Data Architecture & Standards",weight:40,questions:[{id:"D-Q10",sheetRef:"Q10",text:"Is there a formal, documented data model that reflects all key entities, relationships, attributes, and business rules?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q11",sheetRef:"Q11",text:"How mature is master data management \u2014 are authoritative data sources identified, maintained, and trusted?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q12",sheetRef:"Q12",text:"Is data lifecycle governance established, covering creation, versioning, archiving, and secure disposition?",weight:1,answerType:"scale",topics:["data","security"]},{id:"D-Q13",sheetRef:"Q13",text:"Are international and GC data standards applied (e.g., ISO, DCAT, NIEM, GC Open Data Directive)?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q14",sheetRef:"Q14",text:"How well defined is data lineage \u2014 can the origin, transformation, and movement of data be traced end-to-end?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q15",sheetRef:"Q15",text:"Is comprehensive metadata management in place, enabling data discovery, classification, and contextual understanding?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q16",sheetRef:"Q16",text:"How mature is data quality management \u2014 are completeness, accuracy, consistency, and timeliness measured and enforced?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q17",sheetRef:"Q17",text:"Is data instrumentation in place to capture operational telemetry, audit records, and system-generated metadata?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q18",sheetRef:"Q18",text:"Are data read/write performance requirements (volumes, IOPS, movement patterns) understood and architecturally addressed?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q19",sheetRef:"Q19",text:"Is there a strategy for structured, semi-structured, and unstructured data that applies consistent governance across all types?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q20",sheetRef:"Q20",text:"How well is data residency managed \u2014 are intentional copies of data tracked, controlled, and compliant with policy?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q21",sheetRef:"Q21",text:"Does the architecture support event-driven data integration patterns and real-time data processing where needed?",weight:1,answerType:"scale",topics:["data"]}],shareOfDomain:40},{id:"privacy-protection-and-compliance",label:"Privacy, Protection & Compliance",weight:25,questions:[{id:"D-Q22",sheetRef:"Q22",text:"Has a Privacy Impact Assessment (PIA) been completed, and does the architecture reflect its recommendations?",weight:1,answerType:"yesno",topics:["data","privacy"]},{id:"D-Q23",sheetRef:"Q23",text:"Is Privacy by Design embedded throughout the solution, from data collection through to disposition?",weight:1,answerType:"scale",topics:["data","privacy"]},{id:"D-Q24",sheetRef:"Q24",text:"How mature is data categorization \u2014 are all data assets classified by sensitivity, and is handling appropriate to classification?",weight:1,answerType:"scale",topics:["data"]},{id:"D-Q25",sheetRef:"Q25",text:"Is encryption applied at rest, in transit, and in processing for all data at the appropriate sensitivity level?",weight:1,answerType:"scale",
