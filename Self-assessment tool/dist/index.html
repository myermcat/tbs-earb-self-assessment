   ------------------------------------------------------------------------------------------ */
.pledge-scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, .55); z-index: 60; }

  border: 1px solid var(--line-2); border-radius: 14px; padding: 0; z-index: 61;
  max-width: 34rem; width: calc(100% - 2rem); background: var(--surface); color: var(--ink);

dialog.pledge.no-modal {

.pledge-head {

  border-bottom: 1px solid var(--line);
}
.pledge-head h2 { font-size: 1.05rem; margin: 0; flex: 1; color: var(--bad); }
.pledge-x {

  border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2);
  color: var(--ink-3); cursor: not-allowed;
}
.pledge-x[disabled] { opacity: .5; }
.pledge-x.live { color: var(--ink); border-color: var(--line-2); cursor: pointer; }
.pledge-x.live:hover { background: var(--surface); border-color: var(--accent-line); color: var(--accent); }
.pledge-body { padding: .8rem 1rem 1rem; font-size: .9rem; }
.pledge-body p { margin: 0 0 .6rem; }
.pledge-body .steps { margin: 0 0 .7rem; }
.pledge-subject {
  display: block; margin: .35rem 0; padding: .35rem .5rem; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 6px; font-size: .8rem; word-break: break-all;

}
.pledge-hint { font-size: .78rem; color: var(--ink-3); margin: 0 0 .5rem; }
.pledge-out { border-top: 1px solid var(--line); padding-top: .6rem; }

</svg>`;var ge={fileType:"gc-arch-rubric",formatVersion:2,id:"gc-ea-assessment",version:"1.0-dan",status:"draft",title:"GC Enterprise Architecture self-assessment",provenance:`Imported by tools/import-rubric.mjs from Dan's GC_EA_Assessment_Tool workbook (6 sheets) in "EARB target state knowledge base". Questions, section names, section weights, domain weights and the 0-10 ladder are all his. Added by us and marked as such: lifecycle stages, the stage rule on "Defining the Current State" sections, and the routing bands.`,dlgBaseUrl:"https://myermcat.github.io/digital-lifecycle-guide",dlgBaseUrlNote:"The guide, on GitHub Pages for now. Each stage points at its own page there.",importWarnings:["Business Architecture: the section weights in the workbook add up to 80%, not 100%. The missing 20 points are shared out across the 6 sections that are there, in proportion, so the domain still scores out of 10. Worth checking whether a section was left out of the export."],scale:{min:0,max:10,anchors:[{value:0,colour:"Black",name:"Absent",label:"No formal architecture. Capabilities are missing, and manual workarounds are the only way to achieve business outcomes."},{value:1,colour:"Dark Red",name:"Critical Gaps",label:"A skeleton exists, but core capabilities (like security or data integrity) are missing. High risk of systemic failure."},{value:2,colour:"Red",name:"Fragmented",label:'Capabilities exist in "silos." They are inconsistent, undocumented, and require constant manual intervention to stay synchronized.'},{value:3,colour:"Orange",name:"Emergent",label:'Core capabilities are present but brittle. The architecture meets the "happy path" but fails under stress or edge cases.'},{value:4,colour:"Orange-Yellow",name:"Defined",label:"The architecture meets basic functional requirements. Documentation exists, but Quality Attributes (scalability, maintainability) are an afterthought."},{value:5,colour:"Yellow",name:"Integrated",label:"This is the Baseline. All desired capabilities are present and connected. The system is stable and performs as expected under normal conditions."},{value:6,colour:"Yellow-Green",name:"Managed",label:"Capabilities are monitored and measured. The architecture can handle predictable growth and has basic fault tolerance."},{value:7,colour:"Green",name:"Scalable & Secure",label:'The architecture is "hardened." It handles bursts in demand effortlessly and has proactive security measures built into the design.'},{value:8,colour:"Dark Green",name:"Agile/Extensible",label:"The architecture is modular. Adding a new desired capability does not require a rewrite; the system is designed to be plugged into and extended."},{value:9,colour:"Blue",name:"Predictive",label:"The architecture uses telemetry and AI/ML to anticipate needs (e.g., auto-scaling before a spike or self-healing before a crash)."},{value:10,colour:"Purple",name:"Symbiotic",label:'The "North Star" state. The architecture and business strategy are one. The system is so flexible it can pivot to entirely new business models with minimal architectural friction.'}]},maturityBands:[{min:9,label:"Leading Practice",detail:"Predictive, self-optimizing, fully aligned with business strategy."},{min:7,label:"Advanced",detail:"Hardened, scalable, and modular. Demonstrably high-quality architecture."},{min:5,label:"Baseline Ready",detail:"Core capabilities present and stable. Meets minimum GC EA expectations."},{min:3,label:"Developing",detail:"Foundational elements exist but architecture is immature and at risk under stress."},{min:0,label:"Critical Risk",detail:"Immediate intervention required. Core capabilities absent or severely compromised."}],maturityBandsNote:"Dan's own reference guide, from the Summary Dashboard sheet.",bands:[{id:"showcase",min:8.5,label:"Showcase",routing:"No board slot needed. TBS may ask to showcase this work.",tone:"good"},{id:"hallpass",min:6,label:"Hall pass",routing:"Suggested: no GC EARB appearance required. Subject to audit sample.",tone:"good"},{id:"routine",min:3,label:"Routine",routing:"Suggested: no board time. Assessor spot-check only.",tone:"neutral",source:"interpolated"},{id:"attend",min:0,label:"Bring it to the board",routing:"Suggested: attend GC EARB. Come and tell us why, and what the plan is.",tone:"bad"}],bandsNote:'ROUTING, not maturity, and provisional. Dan named three numbers out loud on 2026-08-26: above roughly 60% is an automatic hall pass, around 8.5 is worth showcasing, and around 2 out of 10 means come and explain. He also said the 4, 5, 6 middle is not worth board time. The 3.0 line between "come and explain" and "no board time" is OURS, interpolated to bridge the 2 he named and the 4 he named. He has not seen it. None of these are signed off. The maturity labels above are his.',stageMultipliers:{"low-ok":.25,expected:1,critical:1.5},stageMultipliersNote:'Our addition. Lifecycle stage is not captured in the current process at all - Dan named it as the key missing field. Only "Defining the Current State" sections carry a rule so far.',topics:[{id:"business",label:"Business",note:"Strategy, process, value and cost."},{id:"data",label:"Data",note:"Models, quality, lineage and stewardship."},{id:"application",label:"Application",note:"What the software does and depends on."},{id:"technology",label:"Technology",note:"Where it runs, and whether it stays up."},{id:"security",label:"Security",note:"Cuts across all four. Dan asked for this one by name."},{id:"privacy",label:"Privacy",note:"Personal information specifically, not data in general."}],answerTypesNote:"PROVISIONAL. Dan named this defect: several questions are yes or no wearing a 0 to 10 scale. The ones marked yesno here are the ones whose wording is unambiguously binary. He owns the real list. A no on a yes/no question raises a red flag: it colours the section and the person carries on. Nothing in this tool stops an assessment.",topicsNote:"A second axis, not a second scoring spine. The four domains still produce the overall score, and a question counts once there. A question also counts at full weight inside every topic it carries, which is where the weights genuinely differ. Domain topics are mechanical. Security and privacy were derived from the question wording and are PROVISIONAL: Dan owns the real assignments.",lifecycleStages:[{id:"discovery",label:"Discovery",phase:"Create",dlgPath:"create-discovery",blurb:"Understanding the problem. There may be no current solution to describe yet."},{id:"alpha",label:"Alpha",phase:"Create",dlgPath:"create-alpha",blurb:"Testing whether an approach can work, with real users."},{id:"beta",label:"Beta",phase:"Create",dlgPath:"create-beta",blurb:"Building the real thing in public, at growing scale."},{id:"stabilization",label:"Stabilization",phase:"Live",dlgPath:"live-stabilization",blurb:"In service, settling down. Costs and operations should be known."},{id:"growth",label:"Growth",phase:"Live",dlgPath:"live-growth",blurb:"In service, scaling up."},{id:"maturity",label:"Maturity",phase:"Live",dlgPath:"live-maturity",blurb:"In service, steady state. Everything should be documented and measured."},{id:"sunset",label:"Sunset",phase:"Sunset",dlgPath:"sunset",blurb:"Replacing or retiring. Dependencies and data disposition matter most."}],phases:[{name:"Create",dlgPath:"create",blurb:"Being built, and not in service yet."},{name:"Live",dlgPath:"live",blurb:"In service, with real users."},{name:"Sunset",dlgPath:"sunset",blurb:"Being replaced or retired."}],domains:[{id:"business",label:"Business Architecture",weight:25,description:"Connecting strategy to execution through structured design",sections:[{id:"defining-the-current-state",label:"Defining the Current State",weight:5,questions:[{id:"B-Q1",sheetRef:"Q1",text:"How thoroughly has the current state of this solution been documented, including all processes, data flows, and system dependencies?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q2",sheetRef:"Q2",text:"What entities (data objects, records, clients, files) are currently produced, managed, or maintained by this solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q3",sheetRef:"Q3",text:"Have all roles and responsibilities across stakeholders, operators, and service consumers been identified, documented, and formally accepted?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q4",sheetRef:"Q4",text:"How well understood is the criticality of this solution to Government of Canada program delivery and citizen outcomes?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q5",sheetRef:"Q5",text:"Are all sub-components of the current solution assessed for their individual criticality, availability, and risk exposure?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q6",sheetRef:"Q6",text:"What is the current level of utilization and demand for the solution (transaction volumes, active users, peak load)?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q7",sheetRef:"Q7",text:"What is the known availability, uptime, and service continuity record of the current solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q8",sheetRef:"Q8",text:"How well understood are the total lifecycle costs \u2014 including build, operate, maintain, and decommission \u2014 of the current solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q9",sheetRef:"Q9",text:"What are the current unit economics (cost per transaction, cost per entity managed) and how are they tracked?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q10",sheetRef:"Q10",text:"How mature and current are the performance indicators for this solution, and what trends do they reflect?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q11",sheetRef:"Q11",text:"Is the lifespan and full lifecycle of the solution mapped out, and is the current position within that lifecycle known?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q12",sheetRef:"Q12",text:"What major events (technology refresh, contract renewal, legislative changes) are on the horizon for this solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q13",sheetRef:"Q13",text:"How well understood are the specific skills, staffing levels, and capacity requirements to operate and evolve this solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q14",sheetRef:"Q14",text:"How are universal requirements \u2014 accessibility, official languages, inclusion, and privacy \u2014 currently addressed in the solution?",weight:1,answerType:"scale",topics:["business","privacy"]}],stageExpectation:{discovery:"low-ok",alpha:"low-ok"},shareOfDomain:6.3},{id:"defining-the-business-solution",label:"Defining the Business Solution",weight:25,questions:[{id:"B-Q15",sheetRef:"Q15",text:"How clearly and completely has the core business problem been defined and agreed upon by all stakeholders?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q16",sheetRef:"Q16",text:"Is there a documented business case that articulates the expected value, outcomes, and measurable benefits of the proposed solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q17",sheetRef:"Q17",text:"How well do the proposed solution capabilities map to the GC Business Capability Model and existing enterprise services?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q18",sheetRef:"Q18",text:"Have value streams been fully mapped, showing how business capabilities deliver outcomes to clients and citizens?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q19",sheetRef:"Q19",text:"Is the solution design driven by defined user personas, journeys, and evidence-based user research?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q20",sheetRef:"Q20",text:"How clearly are the target service levels, response times, and quality benchmarks defined for the proposed solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q21",sheetRef:"Q21",text:"Has the solution's criticality to GC program delivery been assessed, and does the architecture reflect that criticality?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q22",sheetRef:"Q22",text:"Is there a funding model and sourcing strategy that is sustainable across the full lifecycle of the solution?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q23",sheetRef:"Q23",text:"How well is the talent strategy defined, including required skills, existing capacity, training pipeline, and long-term retention?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q24",sheetRef:"Q24",text:"Is a demand forecast available, and does the solution design account for projected growth and usage variability?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q25",sheetRef:"Q25",text:"How well is the solution integrated within the broader GC enterprise ecosystem and aligned with whole-of-government priorities?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q26",sheetRef:"Q26",text:"Is the solution designed to maximize reuse of existing GC shared services and platforms before building new capabilities?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q27",sheetRef:"Q27",text:"How transparent is the solution design \u2014 is it documented, accessible, and understandable to those who rely on it?",weight:1,answerType:"scale",topics:["business"]}],shareOfDomain:31.3},{id:"demonstrated-engagement",label:"Demonstrated Engagement",weight:10,questions:[{id:"B-Q28",sheetRef:"Q28",text:"Have user personas, stories, and journeys been mapped and validated through direct engagement with actual users and stakeholders?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q29",sheetRef:"Q29",text:"Are there formal, repeatable mechanisms to capture client, user, and stakeholder needs on a continuous basis?",weight:1,answerType:"scale",topics:["business"]},{id:"B-Q30",sheetRef:"Q30",text:"How mature are feedback loops between the delivery team and end users, inclu
