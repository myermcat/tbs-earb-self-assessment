# Publishes Self-assessment tool/dist/index.html to GitHub Pages.
#
# NOT ENABLED YET. Pages from a private repository needs a paid plan, and this repo holds
# Dan's DRAFT framework, so it must not be made public until he says the content can be.
# Once that is settled: Settings > Pages > Source: GitHub Actions, then push to main.
name: Publish the assessment tool

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Self-assessment tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Self-assessment tool/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
